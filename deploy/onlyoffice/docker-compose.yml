# OnlyOffice Document Server for WorkPass Docs (local / self-hosted)
# Start: .\deploy\start-onlyoffice.ps1
services:
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: workpass-onlyoffice
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: "${ONLYOFFICE_JWT_SECRET:-workpass-onlyoffice-dev-secret}"
      JWT_HEADER: Authorization
      JWT_IN_BODY: "true"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  onlyoffice_data:
  onlyoffice_logs:
