<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="apple-mobile-web-app-title" content="SUPPIX Live Ops" />
  <meta name="application-name" content="SUPPIX Live Ops" />
  <title>SUPPIX — Live Ops Map</title>
  <link rel="apple-touch-icon" sizes="192x192" href="/branding/suppix-icon-192.png" />
  <link rel="icon" type="image/svg+xml" sizes="192x192" href="/branding/suppix-ai-mark.svg" />
  <link id="appFavicon" rel="icon" type="image/png" sizes="192x192" href="/branding/suppix-icon-192.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="/design-tokens.css" />
  <link rel="stylesheet" href="/embed-shell.css?v=20260531shell2" />
  <link rel="stylesheet" href="/ops-shell.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
    header {
      padding: 0.65rem 1rem; border-bottom: 1px solid var(--border); background: var(--panel);
      display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; justify-content: space-between;
    }
    header a { color: var(--accent); font-size: 0.85rem; margin-inline-start: 0.75rem; }
    #map { flex: 1; min-height: 300px; }
    .legend {
      position: absolute; bottom: 12px; left: 12px; z-index: 500; background: var(--panel);
      border: 1px solid var(--border); border-radius: 10px; padding: 0.55rem 0.8rem; font-size: 0.78rem;
      min-width: 9.5rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    }
    .legend-row {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      line-height: 1.35;
      white-space: nowrap;
    }
    .legend-row + .legend-row { margin-top: 0.35rem; }
    .legend-label { flex: 1 1 auto; min-width: 0; }
    .legend .legend-pin {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 0;
      margin-inline-end: 6px;
      vertical-align: middle;
    }
    .legend .legend-pin svg { width: 16px; height: 16px; display: block; }
    .ops-map-pin-wrap {
      background: transparent;
      border: none;
    }
    .ops-map-pin {
      display: flex;
      flex-direction: column;
      align-items: center;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.55));
      pointer-events: auto;
    }
    .ops-map-pin-svg {
      width: 34px;
      height: 34px;
      display: block;
    }
    .ops-map-pin-worker { color: #5eead4; }
    .ops-map-pin-worker-working { color: #5eead4; }
    .ops-map-pin-worker-off_site { color: #fb923c; }
    .ops-map-pin-worker-stale { color: #94a3b8; }
    .ops-map-pin-worker-on_break { color: #38bdf8; }
    .ops-map-pin-worker-on_task { color: #a78bfa; }
    .ops-map-pin-worker-shift_ended { color: #64748b; }
    .ops-map-pin-camera { color: #a78bfa; }
    .ops-map-pin-camera-alert { color: #f87171; }
    .ops-map-pin-geofence { color: #38bdf8; }
    .ops-map-pin-gate { color: #fbbf24; }
    .ops-map-pin-label {
      margin-top: 1px;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(8, 12, 18, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.35);
      color: #f8fafc;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
      max-width: 128px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .side {
      width: 300px; max-width: 42vw; border-inline-start: 1px solid var(--border);
      background: var(--panel); overflow: auto; font-size: 0.8rem;
      display: flex; flex-direction: column;
    }
    .side-tools { padding: 0.55rem 0.65rem; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 0.4rem; }
    .side-tools input, .side-tools select {
      width: 100%; font-size: 0.78rem; padding: 0.35rem 0.45rem;
      border-radius: 6px; border: 1px solid var(--border); background: #0f172a; color: var(--text);
    }
    .status-filters { display: flex; flex-wrap: wrap; gap: 0.25rem; }
    .status-filters button {
      font-size: 0.7rem; padding: 0.2rem 0.4rem; border-radius: 999px;
      border: 1px solid var(--border); background: transparent; color: #94a3b8; cursor: pointer;
    }
    .status-filters button.active { background: #1e293b; color: #e2e8f0; border-color: #64748b; }
    .nearest-box { display: flex; flex-direction: column; gap: 0.3rem; }
    .nearest-box .btn-link, #nearestBtn {
      font-size: 0.75rem; padding: 0.3rem 0.45rem; border-radius: 6px;
      border: 1px solid var(--border); background: #122033; color: #e2e8f0; cursor: pointer; text-align: start;
    }
    .zone-stats { padding: 0.45rem 0.65rem; border-bottom: 1px solid var(--border); font-size: 0.72rem; color: #94a3b8; }
    .zone-stats strong { color: #e2e8f0; }
    .anomaly-list { padding: 0.35rem 0.65rem; border-bottom: 1px solid var(--border); font-size: 0.72rem; color: #fbbf24; }
    .side-body { flex: 1; overflow: auto; }
    .wrap { display: flex; flex: 1; min-height: 0; position: relative; }
    .worker-row { padding: 0.45rem 0.65rem; border-bottom: 1px solid var(--border); cursor: pointer; }
    .worker-row:hover, .worker-row.active { background: #14202c; }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-inline-end: 4px; }
    .status-dot.working { background: #5eead4; }
    .status-dot.off_site { background: #fb923c; }
    .status-dot.stale { background: #94a3b8; }
    .status-dot.on_break { background: #38bdf8; }
    .status-dot.on_task { background: #a78bfa; }
    .trail-panel {
      border-top: 1px solid var(--border); padding: 0.55rem 0.65rem; max-height: 34%;
      overflow: auto; background: #0b1220;
    }
    .trail-panel h4 { margin: 0 0 0.35rem; font-size: 0.8rem; }
    .trail-panel ol { margin: 0; padding-inline-start: 1.1rem; color: #94a3b8; font-size: 0.72rem; }
    #status { font-size: 0.8rem; color: #94a3b8; }
    @media (max-width: 800px) {
      .side {
        display: flex;
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        max-width: none;
        max-height: 42vh;
        border-inline-start: none;
        border-top: 1px solid var(--border);
        z-index: 600;
        box-shadow: 0 -10px 28px rgba(0, 0, 0, 0.35);
      }
      .legend { bottom: calc(42vh + 12px); }
      #map { padding-bottom: 0; }
    }
  </style>
</head>
<body class="ops-app">
  <header class="ops-header">
    <div style="display:flex;align-items:center;gap:0.65rem;">
      <img data-tenant-logo class="tenant-logo-chip" src="/branding/suppix-ai-mark.svg" alt="Suppix AI" />
      <div>
        <strong id="opsMapTitle">Smart Workforce Map</strong>
        <span id="status">Laden…</span>
      </div>
    </div>
    <nav>
      <select id="companySelect" style="display:none"></select>
      <a href="/ops-command-center.html" data-omapi18n="navCommand">Command Center</a>
      <a href="/ai-command-center.html" data-omapi18n="navAi">KI</a>
      <a href="/admin-v2/index.html" data-omapi18n="navAdmin">Admin</a>
      <select id="opsMapLangSelect" aria-label="Sprache" style="font-size:0.78rem;padding:0.2rem 0.35rem;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--text);">
        <option value="de">DE</option><option value="en">EN</option><option value="ar">AR</option>
        <option value="tr">TR</option><option value="fr">FR</option><option value="es">ES</option>
        <option value="it">IT</option><option value="pl">PL</option>
      </select>
      <button type="button" id="refreshBtn" style="margin-inline-start:8px">Aktualisieren</button>
    </nav>
  </header>
  <div class="wrap">
    <div id="map"></div>
    <aside class="side" id="sidePanel">
      <div class="side-tools">
        <input type="search" id="workerSearch" placeholder="Mitarbeiter suchen…" autocomplete="off" />
        <div class="status-filters" id="statusFilters">
          <button type="button" data-status="all" class="active">Alle</button>
          <button type="button" data-status="working">Arbeitet</button>
          <button type="button" data-status="on_break">Pause</button>
          <button type="button" data-status="on_task">Aufgabe</button>
          <button type="button" data-status="off_site">Außerhalb</button>
          <button type="button" data-status="stale">Offline/Stale</button>
        </div>
        <div class="nearest-box">
          <button type="button" id="nearestBtn" class="btn-link">Nächste MA (Kartenmitte)</button>
          <input type="search" id="nearestRole" placeholder="Rolle/Skill Filter…" />
        </div>
      </div>
      <div class="side-body" id="workerList"></div>
      <div class="trail-panel" id="trailPanel" hidden>
        <h4 id="trailTitle"></h4>
        <ol id="trailList"></ol>
      </div>
    </aside>
    <div class="legend">
      <div class="legend-row"><span class="legend-pin ops-map-pin-worker-working"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z" fill="currentColor"/></svg></span><span class="legend-label" data-omapi18n="legendWorking">Arbeitet</span></div>
      <div class="legend-row"><span class="legend-pin ops-map-pin-worker-off_site"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z" fill="currentColor"/></svg></span><span class="legend-label" data-omapi18n="legendOffSite">Außerhalb</span></div>
      <div class="legend-row"><span class="legend-pin ops-map-pin-worker-stale"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z" fill="currentColor"/></svg></span><span class="legend-label" data-omapi18n="legendStale">Letzter Standort</span></div>
      <div class="legend-row"><span class="legend-pin ops-map-pin-geofence"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z" fill="currentColor"/></svg></span><span class="legend-label" data-omapi18n="legendGeofence">Smart Zone</span></div>
      <div class="legend-row"><span class="legend-pin ops-map-pin-camera"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z" fill="currentColor"/></svg></span><span class="legend-label" data-omapi18n="legendCamera">Kameras</span></div>
    </div>
  </div>
  <script src="/embed-helpers.js?v=20260609csrf"></script>
  <script src="/ops-live-map-i18n.js?v=20260802swm1"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js" crossorigin="anonymous"></script>
  <script src="/ops-realtime.js?v=20260726ws1"></script>
  <script>
    (function initEmbed() {
      const params = new URLSearchParams(location.search);
      if (params.get("embed") === "1") {
        document.body.classList.add("embed-mode");
        document.querySelectorAll("header.ops-header nav a").forEach((el) => el.remove());
      }
    })();

    const qs = new URLSearchParams(location.search);
    let companyId = qs.get("company_id") || "";
    let map, layers = { zones: [], workers: [], gates: [], cameras: [], trail: [] };
    const workerMarkersById = new Map();
    let mapFittedOnce = false;
    let livePollTimer = 0;
    let lastMapData = null;
    let statusFilter = "all";
    let searchQuery = "";
    let selectedWorkerId = "";
    let trailPolyline = null;
    const LIVE_POLL_MS = 8000;

    async function api(path) {
      const headers = window.BaupassAuth
        ? window.BaupassAuth.authHeaders({ Accept: "application/json" })
        : { Accept: "application/json" };
      const r = await fetch(path, { credentials: "include", headers });
      const d = await r.json().catch(() => ({}));
      if (r.status === 401) throw new Error("auth");
      if (!r.ok) throw new Error(d.error || d.hint || r.statusText);
      return d;
    }

    function clearLayers(key) {
      layers[key].forEach((l) => map.removeLayer(l));
      layers[key] = [];
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/"/g, "&quot;");
    }

    function statusLabel(status) {
      const key = ({
        working: "statusWorking",
        off_site: "statusOffSite",
        stale: "statusStale",
        shift_ended: "statusShiftEnded",
        on_break: "statusOnBreak",
        on_task: "statusOnTask",
      })[status] || "statusWorking";
      return window.opsMapT(key) || status;
    }

    function zoneKindLabel(kind) {
      const key = `zoneKind_${kind || "site"}`;
      return window.opsMapT(key) || kind || "site";
    }

    function workerMatchesFilters(w) {
      if (statusFilter !== "all" && String(w.status || "") !== statusFilter) return false;
      const q = searchQuery.trim().toLowerCase();
      if (!q) return true;
      const hay = `${w.name || ""} ${w.badgeId || ""} ${w.site || ""} ${(w.currentZone && w.currentZone.name) || ""}`.toLowerCase();
      return hay.includes(q);
    }

    const PIN_SVG =
      '<svg viewBox="0 0 24 24" class="ops-map-pin-svg" aria-hidden="true">' +
      '<path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="currentColor"/>' +
      '<circle cx="12" cy="9" r="2.6" fill="#fff"/>' +
      "</svg>";

    function mapPinIcon(kind, label) {
      const safeLabel = escapeHtml(label);
      const labelHtml = safeLabel
        ? `<span class="ops-map-pin-label">${safeLabel}</span>`
        : "";
      return L.divIcon({
        className: "ops-map-pin-wrap",
        html: `<div class="ops-map-pin ops-map-pin-${kind}" role="img" aria-label="${safeLabel}">${PIN_SVG}${labelHtml}</div>`,
        iconSize: [36, safeLabel ? 52 : 36],
        iconAnchor: [18, safeLabel ? 50 : 34],
        popupAnchor: [0, safeLabel ? -48 : -32],
      });
    }

    function addPinMarker(lat, lng, kind, label, popupHtml, openHref, onClick) {
      const marker = L.marker([lat, lng], {
        icon: mapPinIcon(kind, label),
        title: label || "",
        zIndexOffset:
          kind.startsWith("worker") ? 300 : kind === "camera-alert" ? 400 : kind === "camera" ? 250 : kind === "gate" ? 200 : 100,
      }).addTo(map);
      if (popupHtml) marker.bindPopup(popupHtml);
      marker.on("click", (ev) => {
        try { L.DomEvent.stopPropagation(ev); } catch (_) {}
        if (typeof onClick === "function") {
          onClick(ev);
          return;
        }
        if (!openHref) return;
        const embed = new URLSearchParams(location.search).get("embed") === "1";
        if (embed && window.top && window.top !== window) {
          try {
            window.top.open(openHref, "_blank", "noopener");
            return;
          } catch (_) { /* fall through */ }
        }
        window.open(openHref, "_blank", "noopener");
      });
      return marker;
    }

    function clearTrail() {
      if (trailPolyline) {
        try { map.removeLayer(trailPolyline); } catch (_) {}
        trailPolyline = null;
      }
      clearLayers("trail");
      const panel = document.getElementById("trailPanel");
      if (panel) panel.hidden = true;
    }

    async function showWorkerTrail(worker) {
      if (!companyId || !worker?.id) return;
      selectedWorkerId = String(worker.id);
      try {
        const trail = await api(
          `/api/ops-os/workers/${encodeURIComponent(worker.id)}/trail?company_id=${encodeURIComponent(companyId)}`
        );
        clearTrail();
        const pts = (trail.points || []).map((p) => [p.lat, p.lng]);
        if (pts.length >= 2) {
          trailPolyline = L.polyline(pts, { color: "#5eead4", weight: 3, opacity: 0.85 }).addTo(map);
          layers.trail.push(trailPolyline);
          map.fitBounds(trailPolyline.getBounds(), { padding: [30, 30], maxZoom: 18 });
        } else if (worker.lat != null) {
          map.setView([worker.lat, worker.lng], 17);
        }
        const panel = document.getElementById("trailPanel");
        const title = document.getElementById("trailTitle");
        const list = document.getElementById("trailList");
        title.textContent = `${window.opsMapT("trailTitle") || "Bewegung"} · ${worker.name || ""}`;
        const recent = (trail.points || []).slice(-40).reverse();
        list.innerHTML = recent.length
          ? recent.map((p) => {
              const t = String(p.at || "").slice(11, 19);
              const zk = p.zoneKind ? ` · ${zoneKindLabel(p.zoneKind)}` : "";
              return `<li>${escapeHtml(t)}${escapeHtml(zk)}</li>`;
            }).join("")
          : `<li>${escapeHtml(window.opsMapT("trailEmpty") || "Keine Spurpunkte")}</li>`;
        panel.hidden = false;
        renderSidebar(lastMapData || { workersOnSite: [], cameras: [] });
      } catch (e) {
        console.warn("[trail]", e);
      }
    }

    function renderWorkerMarkers(data) {
      const cid = companyId || data.companyId || "";
      const nextIds = new Set();
      const bounds = [];
      (data.workersOnSite || []).forEach((w) => {
        const id = String(w.id || "");
        if (!id || w.lat == null || w.lng == null) return;
        if (!workerMatchesFilters(w)) return;
        nextIds.add(id);
        bounds.push([w.lat, w.lng]);
        const label = w.name || "MA";
        const status = w.status || "working";
        const pinKind = `worker-${status}`;
        const chatHref = cid
          ? `/admin-v2/chat.html?company_id=${encodeURIComponent(cid)}&worker_id=${encodeURIComponent(id)}`
          : "";
        const zoneName = w.currentZone?.name || "";
        const popup =
          `<b>${escapeHtml(w.name)}</b>` +
          `<br><span class="status-dot ${escapeHtml(status)}"></span>${escapeHtml(statusLabel(status))}` +
          (zoneName ? `<br>${escapeHtml(zoneKindLabel(w.currentZone?.kind))}: ${escapeHtml(zoneName)}` : "") +
          `<br><small>${escapeHtml((w.lastLocationAt || w.lastAccess || "").slice(0, 19))}</small>` +
          (w.positionSource === "live"
            ? `<br><small>${escapeHtml(window.opsMapT("livePosition") || "Live-GPS")}</small>`
            : w.status === "stale"
              ? `<br><small>${escapeHtml(window.opsMapT("lastKnown") || "Letzter Standort")}</small>`
              : "") +
          `<br><button type="button" class="btn-link" data-trail="${escapeHtml(id)}">${escapeHtml(window.opsMapT("showTrail") || "Spur zeigen")}</button>` +
          (chatHref
            ? `<br><a class="btn-link" href="${chatHref}" target="_blank" rel="noopener"><strong>${escapeHtml(window.opsMapT("openChat"))}</strong></a>`
            : "");
        const existing = workerMarkersById.get(id);
        const onClick = () => showWorkerTrail(w);
        if (existing) {
          existing.setLatLng([w.lat, w.lng]);
          existing.setIcon(mapPinIcon(pinKind, label));
          existing.setPopupContent(popup);
          existing.options.title = label;
          existing.off("click");
          existing.on("click", (ev) => {
            try { L.DomEvent.stopPropagation(ev); } catch (_) {}
            onClick();
            existing.openPopup();
          });
        } else {
          const m = addPinMarker(w.lat, w.lng, pinKind, label, popup, null, onClick);
          workerMarkersById.set(id, m);
          layers.workers.push(m);
        }
      });
      for (const [id, marker] of [...workerMarkersById.entries()]) {
        if (nextIds.has(id)) continue;
        try { map.removeLayer(marker); } catch (_) {}
        workerMarkersById.delete(id);
      }
      layers.workers = [...workerMarkersById.values()];
      return bounds;
    }

    function renderSidebar(data) {
      const cid = companyId || data.companyId || "";
      const list = document.getElementById("workerList");
      const workers = (data.workersOnSite || []).filter(workerMatchesFilters);
      const zoneStats = data.zoneStats || [];
      const anomalies = data.mapAnomalies || [];
      const statsHtml = zoneStats.length
        ? `<div class="zone-stats"><strong>${escapeHtml(window.opsMapT("zoneStatsTitle") || "Zonen")}</strong><br>` +
          zoneStats.slice(0, 8).map((z) => {
            const dwell = z.avgDwellMinutes != null ? ` · Ø ${z.avgDwellMinutes}m` : "";
            return `${escapeHtml(z.name || z.zoneId)}: <strong>${z.headcount || 0}</strong>${dwell}`;
          }).join("<br>") + `</div>`
        : "";
      const anomalyHtml = anomalies.length
        ? `<div class="anomaly-list"><strong>${escapeHtml(window.opsMapT("anomaliesTitle") || "Hinweise")}</strong><br>` +
          anomalies.slice(0, 5).map((a) => escapeHtml(a.message || a.code || "")).join("<br>") +
          `</div>`
        : "";
      const workerRows = workers.map((w) => {
        const active = String(w.id) === selectedWorkerId ? " active" : "";
        const zone = w.currentZone?.name || w.site || "";
        return `<div class="worker-row${active}" data-worker-id="${escapeHtml(w.id)}" data-lat="${w.lat}" data-lng="${w.lng}">
          <strong><span class="status-dot ${escapeHtml(w.status || "working")}"></span>${escapeHtml(w.name || "")}</strong>
          <br><span style="color:#94a3b8">${escapeHtml(statusLabel(w.status))} · ${escapeHtml(zone)}</span>
        </div>`;
      }).join("");
      const camRows = (data.cameras || []).map((cam) => {
        const href = cam.href || (cid ? `/admin-v2/camera-watch.html?company_id=${encodeURIComponent(cid)}` : "#");
        return `<div class="worker-row" data-lat="${cam.lat}" data-lng="${cam.lng}" data-open="${escapeHtml(href)}">
          <strong>${escapeHtml(cam.name || "Kamera")}</strong>${cam.alert ? " · ⚠" : ""}<br>
          <span style="color:#94a3b8">${escapeHtml(cam.zone || "")}</span>
        </div>`;
      }).join("");
      list.innerHTML =
        statsHtml +
        anomalyHtml +
        `<h3 style='margin:0.5rem 0.65rem;font-size:0.85rem'>${window.opsMapT("sidebarTitle")}</h3>` +
        (workerRows || `<p style='padding:0.65rem'>${window.opsMapT("nobodyCheckedIn")}</p>`) +
        `<h3 style='margin:0.85rem 0.65rem 0.35rem;font-size:0.85rem'>${window.opsMapT("sidebarCameras")}</h3>` +
        (camRows || `<p style='padding:0.65rem;color:#94a3b8'>${window.opsMapT("noCameras")}</p>`);
      list.querySelectorAll(".worker-row[data-worker-id]").forEach((row) => {
        row.onclick = () => {
          const w = (data.workersOnSite || []).find((x) => String(x.id) === row.dataset.workerId);
          if (w) showWorkerTrail(w);
          else map.setView([+row.dataset.lat, +row.dataset.lng], 17);
        };
      });
      list.querySelectorAll(".worker-row[data-open]").forEach((row) => {
        row.onclick = () => {
          map.setView([+row.dataset.lat, +row.dataset.lng], 17);
          if (row.dataset.open) window.open(row.dataset.open, "_blank", "noopener");
        };
      });
    }

    function renderMap(data) {
      lastMapData = data;
      const c = data.center || { lat: 52.52, lng: 13.405 };
      if (!map) {
        map = L.map("map").setView([c.lat, c.lng], 15);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19, attribution: "© OSM",
        }).addTo(map);
      }
      clearLayers("zones");
      clearLayers("gates");
      clearLayers("cameras");
      const bounds = [];
      const cid = companyId || data.companyId || "";
      (data.geofences || []).forEach((z) => {
        if (z.latitude == null) return;
        const color = z.color || "#38bdf8";
        const circle = L.circle([z.latitude, z.longitude], {
          radius: z.radius_meters || 50,
          color,
          weight: 2,
          fillColor: color,
          fillOpacity: 0.14,
        }).addTo(map);
        const cams = z.cameras || [];
        const camLinks = cams.length
          ? `<br><b>${escapeHtml(window.opsMapT("zoneCameras") || "Kameras")}</b><br>` +
            cams.map((c) =>
              `<a class="btn-link" href="${escapeHtml(c.href || "#")}" target="_blank" rel="noopener">${escapeHtml(c.name)}</a>`
            ).join("<br>")
          : `<br><small>${escapeHtml(window.opsMapT("noCameras") || "")}</small>`;
        const siteLabel = z.site_name || "Zone";
        circle.bindPopup(
          `<b>${escapeHtml(siteLabel)}</b><br>${escapeHtml(zoneKindLabel(z.zone_kind))} · ${z.radius_meters || 50}m` + camLinks
        );
        circle.on("click", () => circle.openPopup());
        layers.zones.push(circle);
        const pin = addPinMarker(
          z.latitude,
          z.longitude,
          "geofence",
          siteLabel,
          `<b>${escapeHtml(siteLabel)}</b><br>${escapeHtml(zoneKindLabel(z.zone_kind))}${camLinks}`,
          null,
          () => circle.openPopup(),
        );
        layers.zones.push(pin);
        bounds.push([z.latitude, z.longitude]);
      });
      bounds.push(...renderWorkerMarkers(data));
      (data.gates || []).forEach((g) => {
        const label = g.name || "Gate";
        const m = addPinMarker(g.lat, g.lng, "gate", label, `<b>${escapeHtml(label)}</b>`);
        layers.gates.push(m);
        bounds.push([g.lat, g.lng]);
      });
      (data.cameras || []).forEach((cam) => {
        const label = cam.name || "Kamera";
        const kind = cam.alert ? "camera-alert" : "camera";
        const href = cam.href || (cid ? `/admin-v2/camera-watch.html?company_id=${encodeURIComponent(cid)}` : "#");
        const popup =
          `<b>${escapeHtml(label)}</b><br>${escapeHtml(cam.zone || "")}` +
          `<br>${cam.alert ? escapeHtml(window.opsMapT("cameraAlert")) : escapeHtml(window.opsMapT("cameraOk"))}` +
          `<br><a class="btn-link" href="${escapeHtml(href)}" target="_blank" rel="noopener"><strong>${escapeHtml(window.opsMapT("openCameraWatch"))}</strong></a>`;
        const m = addPinMarker(cam.lat, cam.lng, kind, label, popup, href !== "#" ? href : null);
        layers.cameras.push(m);
        bounds.push([cam.lat, cam.lng]);
      });
      if (!mapFittedOnce && bounds.length > 1) {
        map.fitBounds(bounds, { padding: [40, 40] });
        mapFittedOnce = true;
      }
      const missing = data.counts?.missingExpected ?? data.missingExpected ?? 0;
      const camAlerts = data.counts?.cameraAlerts ?? data.openCameraEscalations ?? 0;
      const security = data.openSecurityAlerts ?? data.counts?.security ?? 0;
      const statusEl = document.getElementById("status");
      statusEl.textContent = window.opsMapT("statusLineSmart", {
        onSite: data.counts?.onSite ?? 0,
        working: data.counts?.working ?? data.statusCounts?.working ?? 0,
        offSite: data.counts?.offSite ?? data.statusCounts?.off_site ?? 0,
        stale: data.counts?.stale ?? data.statusCounts?.stale ?? 0,
        onBreak: data.counts?.onBreak ?? data.statusCounts?.on_break ?? 0,
        onTask: data.counts?.onTask ?? data.statusCounts?.on_task ?? 0,
        missing,
        cameras: data.counts?.cameras ?? 0,
        cameraAlerts: camAlerts,
        security,
      });
      statusEl.style.color = (camAlerts > 0 || security > 0 || missing > 0) ? "#fbbf24" : "";
      renderSidebar(data);
    }

    async function load() {
      if (!companyId) {
        document.getElementById("status").textContent = window.opsMapT("selectCompany");
        return;
      }
      const data = await api(`/api/ops-os/live-map?company_id=${encodeURIComponent(companyId)}`);
      renderMap(data);
    }

    function startLivePolling() {
      if (livePollTimer) window.clearInterval(livePollTimer);
      livePollTimer = window.setInterval(() => {
        load().catch(() => {});
      }, LIVE_POLL_MS);
    }

    async function applyOpsMapBranding() {
      try {
        if (window.BaupassAuth?.resolveTenantBranding) {
          await window.BaupassAuth.resolveTenantBranding({ companyId });
        }
      } catch {
        // optional
      }
    }

    async function boot() {
      try {
        const boot = window.BaupassAuth?.bootstrapSession
          ? await window.BaupassAuth.bootstrapSession()
          : await api("/api/session/bootstrap");
        const role = boot?.user?.role || "";
        if (role === "company-admin") companyId = boot.user.company_id || companyId;
        if (role === "superadmin") {
          const sel = document.getElementById("companySelect");
          sel.style.display = "inline-block";
          const rows = await api("/api/companies");
          sel.innerHTML = `<option value="">${window.opsMapT("companyPlaceholder")}</option>` + rows.filter(c => !c.deleted_at).map(c =>
            `<option value="${c.id}" ${c.id === companyId ? "selected" : ""}>${c.name}</option>`).join("");
          sel.onchange = () => {
            companyId = sel.value;
            mapFittedOnce = false;
            selectedWorkerId = "";
            clearTrail();
            workerMarkersById.forEach((m) => { try { map?.removeLayer(m); } catch (_) {} });
            workerMarkersById.clear();
            layers.workers = [];
            applyOpsMapBranding().finally(() => load().catch(e => alert(e.message)));
          };
        }
        await applyOpsMapBranding();
        await load();
        startLivePolling();
        if (window.SUPPIXOpsRealtime) {
          await window.SUPPIXOpsRealtime.start({
            companyId,
            feedEl: null,
            onMode: (mode) => {
              const st = document.getElementById("status");
              if (!st || !mode) return;
              const base = st.textContent.split(" · ")[0].trim();
              if (mode === "websocket" || mode === "sse") {
                st.textContent = `${base} · ${mode}`;
              }
            },
            onEvent: () => load().catch(() => {}),
          });
        } else {
          let url = "/api/ops-os/events/stream";
          if (companyId) url += `?company_id=${encodeURIComponent(companyId)}`;
          const es = new EventSource(url, { withCredentials: true });
          es.onmessage = (ev) => {
            try {
              const p = JSON.parse(ev.data);
              if (p.type === "events") load().catch(() => {});
            } catch { /* ignore */ }
          };
        }
      } catch (e) {
        document.getElementById("status").textContent = window.opsMapT("authRequired");
        alert(e.message);
      }
    }

    window.__opsMapReload = () => load().catch((e) => alert(e.message));

    document.getElementById("refreshBtn")?.addEventListener("click", () =>
      load().catch((e) => alert(e.message)),
    );
    document.getElementById("workerSearch")?.addEventListener("input", (ev) => {
      searchQuery = ev.target.value || "";
      if (lastMapData) renderMap(lastMapData);
    });
    document.getElementById("statusFilters")?.addEventListener("click", (ev) => {
      const btn = ev.target.closest("button[data-status]");
      if (!btn) return;
      statusFilter = btn.dataset.status || "all";
      document.querySelectorAll("#statusFilters button").forEach((b) => b.classList.toggle("active", b === btn));
      if (lastMapData) renderMap(lastMapData);
    });
    document.getElementById("nearestBtn")?.addEventListener("click", async () => {
      if (!companyId || !map) return;
      const c = map.getCenter();
      const role = document.getElementById("nearestRole")?.value || "";
      try {
        const q = new URLSearchParams({
          company_id: companyId,
          lat: String(c.lat),
          lng: String(c.lng),
          limit: "5",
        });
        if (role.trim()) q.set("role", role.trim());
        const data = await api(`/api/ops-os/nearest-workers?${q.toString()}`);
        const workers = data.workers || [];
        if (!workers.length) {
          alert(window.opsMapT("nearestEmpty") || "Keine Mitarbeiter in der Nähe");
          return;
        }
        const top = workers[0];
        map.setView([top.lat, top.lng], 17);
        const lines = workers.map((w, i) =>
          `${i + 1}. ${w.name || w.id} · ${w.distanceMeters}m · ${statusLabel(w.status)}`
        ).join("\n");
        alert(`${window.opsMapT("nearestTitle") || "Nächste Mitarbeiter"}\n${lines}`);
        const full = (lastMapData?.workersOnSite || []).find((x) => String(x.id) === String(top.id));
        if (full) showWorkerTrail(full);
      } catch (e) {
        alert(e.message || "nearest failed");
      }
    });
    window.initOpsMapLangSync?.();
    boot();
  </script>
</body>
</html>
