# Worker app release pipeline — APK build + optional Firebase config from secrets.
name: mobile-release

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Backend URL baked into APK
        required: false
        default: https://suppix-workpass-ai.up.railway.app
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-release.yml"

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.5"
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Inject Firebase google-services.json (optional)
        working-directory: mobile/android/app
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$FIREBASE_JSON" ]; then
            printf '%s' "$FIREBASE_JSON" > google-services.json
            cp google-services.json "$RUNNER_TEMP/google-services.json.injected"
            echo "Firebase config injected from secret."
          else
            echo "FIREBASE_GOOGLE_SERVICES_JSON not set — using repo placeholder if present."
          fi

      - name: Complete Flutter platform scaffolding
        working-directory: mobile
        run: flutter create . --org com.baupass --project-name worker

      - name: Restore native customizations
        run: |
          rm -rf mobile/android/app/src/main/kotlin/com/baupass/baupass_worker || true
          git checkout HEAD -- \
            mobile/android/app/build.gradle.kts \
            mobile/android/settings.gradle.kts \
            mobile/android/gradle.properties \
            mobile/android/gradle/wrapper/gradle-wrapper.properties \
            mobile/android/build.gradle.kts \
            mobile/android/app/src/main/kotlin/com/baupass/worker/NfcReaderPlugin.kt \
            mobile/android/app/src/main/kotlin/com/baupass/worker/BrandingPlugin.kt \
            mobile/android/app/src/main/kotlin/com/baupass/worker/MainActivity.kt \
            mobile/android/app/src/main/AndroidManifest.xml \
            mobile/android/app/src/main/res \
            mobile/lib \
            mobile/pubspec.yaml \
            mobile/analysis_options.yaml \
            mobile/test

      - name: Restore injected Firebase config
        run: |
          if [ -f "$RUNNER_TEMP/google-services.json.injected" ]; then
            cp "$RUNNER_TEMP/google-services.json.injected" mobile/android/app/google-services.json
            echo "Restored injected Firebase google-services.json."
          fi

      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build release APK
        id: build_apk
        working-directory: mobile
        env:
          API_URL: ${{ github.event.inputs.api_base_url || 'https://suppix-workpass-ai.up.railway.app' }}
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1 -Xmx1536m
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          VERSION_NAME=$(python - <<'PY'
          import re, pathlib
          text = pathlib.Path("pubspec.yaml").read_text(encoding="utf-8")
          m = re.search(r"^version:\s*([^\s+#]+)", text, re.M)
          print(m.group(1) if m else "0.1.0")
          PY
          )
          echo "Building Worker APK versionName=$VERSION_NAME versionCode=$BUILD_NUMBER"
          # Split ABI avoids fat packageRelease OOMs on GitHub runners; ship arm64 as the release APK.
          # versionCode = GitHub run number so "Worker APK build N" matches the installed app.
          flutter build apk --release --split-per-abi \
            --build-name="$VERSION_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=BAUPASS_API_URL="$API_URL" 2>&1 | tee build-apk.log || {
            echo "----- build-apk.log (last 120 lines) -----"
            tail -n 120 build-apk.log || true
            echo "::error title=APK build failed::$(grep -E 'What went wrong|Execution failed|error:|Error:' build-apk.log | tail -n 15 | tr '\n' ' ')"
            exit 1
          }
          OUT="build/app/outputs/flutter-apk"
          if [ -f "$OUT/app-arm64-v8a-release.apk" ]; then
            cp "$OUT/app-arm64-v8a-release.apk" "$OUT/app-release.apk"
          elif [ -f "$OUT/app-release.apk" ]; then
            echo "Using universal app-release.apk"
          else
            echo "No APK produced under $OUT"
            ls -la "$OUT" || true
            exit 1
          fi
          ls -lah "$OUT"/*.apk
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Upload build log on failure
        if: failure() && steps.build_apk.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-apk-log
          path: mobile/build-apk.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: baupass-worker-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Publish GitHub Release (APK asset)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: worker-apk-${{ github.run_number }}
          name: Worker APK build ${{ github.run_number }} (${{ env.VERSION_NAME }})
          body: |
            Live GPS + map pin update.
            - versionName: `${{ env.VERSION_NAME }}`
            - versionCode / build: `${{ github.run_number }}`
            - API: `${{ github.event.inputs.api_base_url || 'https://suppix-workpass-ai.up.railway.app' }}`
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
          generate_release_notes: true

      - name: Release summary
        env:
          API_URL: ${{ github.event.inputs.api_base_url || 'https://suppix-workpass-ai.up.railway.app' }}
          RELEASE_TAG: worker-apk-${{ github.run_number }}
        run: |
          REPO="${{ github.repository }}"
          APK_URL="https://github.com/${REPO}/releases/download/${RELEASE_TAG}/app-release.apk"
          {
            echo "## Mobile release"
            echo ""
            echo "- API URL (baked into APK): \`$API_URL\`"
            echo "- App version: \`${{ env.VERSION_NAME }}+${{ github.run_number }}\`"
            echo "- CI artifact: \`baupass-worker-release\`"
            echo "- GitHub Release APK: \`${APK_URL}\`"
            echo ""
            echo "### Railway"
            echo "Set \`BAUPASS_WORKER_APK_URL\` to the Release URL above."
          } >> "$GITHUB_STEP_SUMMARY"
