  <style>
    main { padding: 0.75rem 1rem; display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    .card {
      background: var(--panel); border-radius: 12px; padding: 0.85rem; border: 1px solid var(--border);
      transition: border-color 0.2s, transform 0.15s;
    }
    .card.critical { border-color: var(--danger); box-shadow: 0 0 0 1px rgba(248, 113, 113, 0.25); }
    .card.clickable { cursor: pointer; }
    .card.clickable:hover { border-color: var(--accent); transform: translateY(-2px); }
    .metric { font-size: 1.65rem; font-weight: 700; color: var(--accent); }
    .label { font-size: 0.8rem; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { text-align: start; padding: 0.4rem 0.35rem; border-bottom: 1px solid var(--border); }
    tr[data-cid] { cursor: pointer; }
    tr[data-cid]:hover { background: #14202c; }
    .err { color: var(--danger); padding: 1rem; }
    #status { font-size: 0.8rem; color: var(--muted); }
    .actions { margin-top: 0.6rem; display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .actions a, .actions button {
      font-size: 0.72rem; padding: 0.3rem 0.55rem; border-radius: 8px; border: 1px solid var(--border);
      background: #0c1218; color: var(--accent); cursor: pointer; text-decoration: none;
    }
    .event-feed { max-height: 190px; overflow-y: auto; font-size: 0.74rem; }
    .event-line { padding: 0.35rem 0; border-bottom: 1px solid var(--border); color: var(--muted); }
    .event-line strong { color: var(--text); }
    .guardian-card { grid-column: 1 / -1; border-color: var(--accent); }
    .guardian-card.degraded { border-color: var(--warn); }
    .guardian-card.down { border-color: var(--danger); box-shadow: 0 0 0 1px rgba(248, 113, 113, 0.25); }
    .guardian-head { display: flex; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
    .guardian-status { font-size: 1.1rem; font-weight: 700; color: var(--accent); text-transform: uppercase; }
    .guardian-card.degraded .guardian-status { color: var(--warn); }
    .guardian-card.down .guardian-status { color: var(--danger); }
    .guardian-probes { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.65rem; }
    .guardian-probe {
      font-size: 0.68rem; padding: 0.18rem 0.4rem; border-radius: 999px;
      border: 1px solid var(--border); color: var(--muted);
    }
    .guardian-probe.ok { border-color: rgba(75, 227, 209, 0.35); color: var(--accent); }
    .guardian-probe.fail { border-color: rgba(248, 113, 113, 0.45); color: var(--danger); }
    .guardian-actions { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.55rem; }
    .guardian-actions button {
      font-size: 0.7rem; padding: 0.28rem 0.5rem; border-radius: 8px;
      border: 1px solid var(--border); background: #0c1218; color: var(--accent); cursor: pointer;
    }
    .guardian-ops { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.55rem; }
    .guardian-ops span { font-size: 0.68rem; color: var(--muted); padding: 0.18rem 0.4rem; border: 1px solid var(--border); border-radius: 999px; }
    .guardian-ops span.warn { color: var(--warn); border-color: rgba(251, 191, 36, 0.4); }
    .guardian-history { margin-top: 0.55rem; font-size: 0.68rem; color: var(--muted); max-height: 110px; overflow-y: auto; }
    .guardian-history-row { padding: 0.2rem 0; border-bottom: 1px solid var(--border); }
    .payroll-card { grid-column: 1 / -1; }
    .payroll-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; justify-content: space-between; padding: 0.45rem 0; border-bottom: 1px solid var(--border); }
    .payroll-row:last-child { border-bottom: 0; }
    .payroll-actions button { margin-left: 0.25rem; }
    .lohn-notify-stack { grid-column: 1 / -1; display: grid; gap: 0.55rem; }
    .lohn-toast {
      display: grid; grid-template-columns: auto 1fr auto; gap: 0.75rem; align-items: start;
      padding: 0.9rem 1rem; border-radius: 14px;
      border: 1px solid rgba(251, 191, 36, 0.45);
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.16), rgba(15, 23, 32, 0.95));
      box-shadow: 0 10px 28px rgba(0,0,0,0.28);
      animation: lohnToastIn 0.35s ease-out;
    }
    @keyframes lohnToastIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .lohn-toast-badge {
      width: 2.35rem; height: 2.35rem; border-radius: 12px; display: grid; place-items: center;
      background: rgba(251, 191, 36, 0.2); color: #fbbf24; font-weight: 800; font-size: 0.85rem;
    }
    .lohn-toast-title { font-weight: 700; color: var(--text); font-size: 0.95rem; }
    .lohn-toast-body { margin-top: 0.2rem; color: var(--muted); font-size: 0.78rem; line-height: 1.35; }
    .lohn-toast-meta { margin-top: 0.35rem; font-size: 0.68rem; color: #fbbf24; letter-spacing: 0.02em; }
    .lohn-toast-actions { display: flex; flex-direction: column; gap: 0.3rem; }
    .lohn-toast-actions button, .lohn-hub button, .lohn-item button {
      font-size: 0.72rem; padding: 0.35rem 0.6rem; border-radius: 8px;
      border: 1px solid var(--border); background: #0c1218; color: var(--accent); cursor: pointer;
      white-space: nowrap;
    }
    .lohn-toast-actions button.primary, .lohn-item button.primary {
      border-color: rgba(75, 227, 209, 0.45); background: rgba(75, 227, 209, 0.12);
    }
    .lohn-toast-actions button.ghost { color: var(--muted); }
    .lohn-hub {
      grid-column: 1 / -1 !important;
      border: 1px solid rgba(75, 227, 209, 0.45) !important;
      background: linear-gradient(180deg, rgba(18, 28, 38, 0.98), rgba(10, 16, 22, 0.98)) !important;
      border-radius: 16px; padding: 0;
      overflow: hidden;
      min-height: 8rem;
      position: relative;
      z-index: 5;
    }
    .lohn-hub-head {
      display: flex; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; align-items: center;
      padding: 0.85rem 1rem; border-bottom: 1px solid var(--border);
      background: rgba(75, 227, 209, 0.1);
    }
    .lohn-hub-title { font-weight: 700; color: #eaf3ff !important; font-size: 1.05rem; }
    .lohn-hub-sub { color: var(--muted); font-size: 0.72rem; margin-top: 0.15rem; }
    .lohn-hub-pills { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .lohn-pill {
      font-size: 0.68rem; padding: 0.2rem 0.5rem; border-radius: 999px;
      border: 1px solid var(--border); color: var(--muted);
    }
    .lohn-pill.warn { color: #fbbf24; border-color: rgba(251, 191, 36, 0.4); }
    .lohn-pill.ok { color: var(--accent); border-color: rgba(75, 227, 209, 0.35); }
    .lohn-hub-body { display: grid; gap: 0; }
    .lohn-section { padding: 0.85rem 1rem; border-bottom: 1px solid var(--border); }
    .lohn-section:last-child { border-bottom: 0; }
    .lohn-section-head {
      display: flex; justify-content: space-between; gap: 0.5rem; align-items: center; margin-bottom: 0.55rem;
    }
    .lohn-section-title { font-size: 0.78rem; font-weight: 650; color: var(--text); }
    .lohn-section-hint { font-size: 0.68rem; color: var(--muted); }
    .lohn-empty { font-size: 0.75rem; color: var(--muted); padding: 0.35rem 0; }
    .lohn-item {
      display: grid; grid-template-columns: 1fr auto; gap: 0.65rem; align-items: start;
      padding: 0.65rem 0.7rem; margin: 0.35rem 0; border-radius: 12px;
      border: 1px solid var(--border); background: rgba(8, 14, 20, 0.65);
    }
    .lohn-item.unread { border-color: rgba(251, 191, 36, 0.35); background: rgba(251, 191, 36, 0.05); }
    .lohn-item-title { font-weight: 650; font-size: 0.84rem; color: var(--text); }
    .lohn-item-body { margin-top: 0.2rem; font-size: 0.74rem; color: var(--muted); line-height: 1.35; }
    .lohn-item-meta { margin-top: 0.3rem; font-size: 0.66rem; color: #94a3b8; }
    .lohn-item-actions { display: flex; flex-direction: column; gap: 0.3rem; }
    .lohn-link-row { font-size: 0.78rem; color: var(--muted); }
    .lohn-link-row strong { color: var(--text); }
    .lohn-link-row a { color: #fbbf24; }
    #lohnHeaderChip {
      font-size: 0.72rem; padding: 0.28rem 0.55rem; border-radius: 999px;
      border: 1px solid rgba(75, 227, 209, 0.45); background: rgba(75, 227, 209, 0.12);
      color: var(--accent); text-decoration: none; white-space: nowrap;
    }
    #lohnHeaderChip.has-mail {
      border-color: rgba(251, 191, 36, 0.55); background: rgba(251, 191, 36, 0.14); color: #fbbf24;
    }

      Object.entries(navMap).forEach(([id, key]) => {

      });

      if (statusEl && !lastPayload) statusEl.textContent = tr("loading");

    function initOpsLangSync() {
      applyOpsUiLanguage();
      const langSel = document.getElementById("opsLangSelect");
      if (langSel && !langSel.dataset.bound) {
        langSel.dataset.bound = "1";
        langSel.addEventListener("change", () => {
          localStorage.setItem(UI_LANG_KEY, langSel.value);
          localStorage.setItem("baupass-admin-v2-lang", langSel.value);
          applyOpsUiLanguage();
          if (lastPayload) render(lastPayload, lastForecast, lastGuardianBundle);
          window.dispatchEvent(new CustomEvent("baupass-admin-lang", { detail: { lang: langSel.value } }));
        });
      }
    }

    function syncOpsLangFromParent(lang) {
      const code = String(lang || "").slice(0, 2).toLowerCase();
      if (!OPS_LANGS.includes(code) || code === OPS_LANG) return;
      applyOpsUiLanguage();
      if (lastPayload) render(lastPayload, lastForecast, lastGuardianBundle);
    }

    function renderGuardianCard(guardian, history) {
      if (!guardian || !guardian.timestamp) return "";
      const status = String(guardian.status || "unknown").toLowerCase();
      const cls = status === "ok" ? "" : status === "down" ? "down" : "degraded";
      const statusLabel = status === "ok" ? tr("statusOk") : status === "down" ? tr("statusOffline") : tr("statusDegraded");
      const failed = Array.isArray(guardian.failedProbes) ? guardian.failedProbes : [];
      const probes = Array.isArray(guardian.probes) ? guardian.probes : [];
      const probeHtml = probes.map((p) => {
        const ok = !!p.ok;
        const label = p.id || "probe";
        return `<span class="guardian-probe ${ok ? "ok" : "fail"}">${label}${p.latencyMs != null ? ` · ${p.latencyMs}ms` : ""}</span>`;
      }).join("");
      const host = (guardian.cloud && guardian.cloud.host) || "";
      const checked = (guardian.timestamp || "").replace("T", " ").slice(0, 19);
      const alertHint = failed.length
        ? tr("guardianAffected", { list: failed.join(", ") })
        : (guardian.workersDegraded ? tr("guardianWorkersMissing") : tr("guardianAllGreen"));
      const remediation = guardian.remediation || {};
      const applied = remediation.appliedCount ?? 0;
      const remediationHint = remediation.enabled
        ? (applied > 0 ? tr("guardianAutoRepair", { n: applied }) : tr("guardianAutoRepairReady"))
        : "";
      const reProbe = guardian.reProbe || {};
      const recovered = Array.isArray(reProbe.recovered) ? reProbe.recovered : [];
      const reProbeHint = recovered.length ? tr("guardianReProbeRecovered", { list: recovered.join(", ") }) : "";
      const sec = guardian.security || {};
      const secHint = sec.enabled
        ? (sec.elevated
          ? tr("guardianSecurityElevated", { n: sec.failedLogins15m ?? 0, severity: String(sec.severity || "warn").toUpperCase() })
          : tr("guardianSecurityOk", { n: sec.failedLogins24h ?? 0 }))
        : "";
      const extraHints = [remediationHint, reProbeHint, secHint].filter(Boolean).join(" · ");
      const ops = guardian.ops || {};
      const opsHtml = `
        <div class="guardian-ops">
          <span class="${(ops.criticalInvoiceRetries || 0) > 0 ? "warn" : ""}">${tr("invoiceRetry")}: ${ops.criticalInvoiceRetries ?? 0}</span>
          <span class="${(ops.invoiceDeadLetters || 0) > 0 ? "warn" : ""}">${tr("invoiceDl")}: ${ops.invoiceDeadLetters ?? 0}</span>
          <span class="${(ops.queueDeadLetterEvents || 0) > 0 ? "warn" : ""}">${tr("queueDl")}: ${ops.queueDeadLetterEvents ?? 0}</span>
          <span>${tr("worker")}: ${ops.activeWorkers ?? 0}</span>
        </div>`;
      const historyHtml = (history || []).slice(0, 8).map((row) => {
        const ts = String(row.timestamp || "").replace("T", " ").slice(0, 16);
        const st = String(row.status || "?").toUpperCase();
        const fixes = row.appliedCount ? ` · ${row.appliedCount} ${tr("guardianFix")}` : "";
        return `<div class="guardian-history-row">${ts} · ${st}${fixes}</div>`;
      }).join("") || `<div class="guardian-history-row">—</div>`;
      return `
        <div class="card guardian-card ${cls}" id="guardianCard">
          <div class="guardian-head">
            <div>
              <div class="label">${tr("guardianLabel")}</div>
              <div class="guardian-status">${statusLabel}</div>
              <div class="label" style="margin-top:0.35rem">${alertHint}</div>
              ${extraHints ? `<div class="label" style="margin-top:0.25rem">${extraHints}</div>` : ""}
            </div>
            <div class="label">${host ? host + "<br>" : ""}${checked} UTC</div>
          </div>
          <div class="guardian-probes">${probeHtml || '<span class="guardian-probe">—</span>'}</div>
          ${opsHtml}
          <div class="guardian-actions">
            <button type="button" id="guardianCheckBtn">${tr("healthCheck")}</button>
            <button type="button" id="guardianRepairBtn">${tr("repairNow")}</button>
          </div>
          <div class="guardian-history">${historyHtml}</div>
        </div>`;
    }

          <span class="lohn-pill ${enabled ? "ok" : "warn"}">${enabled ? tr("lohnLinkOn") : tr("lohnLinkOff")}</span>
        </div>
        <div class="lohn-link-row"><strong>${tr("lohnLinkBase")}:</strong> ${baseUrl || "—"}</div>
        <div class="lohn-link-row">${tr("lohnLinkAuto")}: ${auto ? "✓" : "—"}</div>
        <div class="lohn-link-row muted">${tr("lohnLinkHint")}</div>
        <p class="lohn-link-row"><a href="/index.html#admin">${tr("lohnLinkOpenAdmin")}</a></p>
      </div>`;
    }

    function escapeLohnHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function updateLohnHeaderChip(messages) {
      const chip = document.getElementById("lohnHeaderChip");
      if (!chip) return;
      const list = Array.isArray(messages) ? messages : [];
      const n = list.length;
      chip.textContent = n ? `WorkPass Lohn (${n})` : "WorkPass Lohn";
      chip.classList.toggle("has-mail", n > 0);
      chip.href = "#lohnHub";
    }

    function renderLohnHubSafe(lohnLink, lohnMessages, dataAlerts, payrollBatches) {
      try {
        return renderLohnHub(lohnLink, lohnMessages, dataAlerts, payrollBatches);
      } catch (err) {
        console.error("lohn hub render failed", err);
        return `<div class="lohn-hub" id="lohnHub">
          <div class="lohn-hub-head">
            <div>
              <div class="lohn-hub-title">WorkPass Lohn</div>
              <div class="lohn-hub-sub">Panel konnte nicht geladen werden — bitte Seite neu laden (Strg+F5).</div>
            </div>
          </div>
          <div class="lohn-section"><div class="lohn-empty">${escapeLohnHtml(err && err.message ? err.message : "render_error")}</div></div>
        </div>`;
      }
    }

    function renderLohnHub(lohnLink, lohnMessages, dataAlerts, payrollBatches) {
      const msgCount = Array.isArray(lohnMessages) ? lohnMessages.length : 0;
      const alertCount = Array.isArray(dataAlerts) ? dataAlerts.length : 0;
      const batchCount = Array.isArray(payrollBatches) ? payrollBatches.length : 0;
      const notifyCount = (Array.isArray(lohnMessages) ? lohnMessages : []).filter((m) => m.bannerVisible !== false).length;
      return `${renderLohnNotificationToasts(lohnMessages)}
      <div class="lohn-hub" id="lohnHub">
        <div class="lohn-hub-head">
          <div>
            <div class="lohn-hub-title">${tr("lohnHubTitle")}</div>
            <div class="lohn-hub-sub">${tr("lohnHubSub")}</div>
          </div>
          <div class="lohn-hub-pills">
            ${notifyCount ? `<span class="lohn-pill warn">${notifyCount} | ${escapeLohnHtml(tr("lohnMessagesToastEyebrow"))}</span>` : ""}
            <span class="lohn-pill ${msgCount ? "warn" : "ok"}">${msgCount ? tr("lohnMessagesPending", { n: msgCount }) : tr("lohnMessagesNone")}</span>
            <span class="lohn-pill ${alertCount ? "warn" : ""}">${alertCount ? tr("dataAlertsPending", { n: alertCount }) : tr("dataAlertsNone")}</span>
            <span class="lohn-pill ${batchCount ? "warn" : ""}">${batchCount ? tr("payrollPending", { n: batchCount }) : tr("payrollNone")}</span>
          </div>
        </div>
        <div class="lohn-hub-body">
          ${renderLohnMessagesSection(lohnMessages)}
          ${renderDataAlertsSection(dataAlerts)}
          ${renderPayrollCard(payrollBatches)}
          ${renderLohnLinkSection(lohnLink)}
        </div>
      </div>`;
    }

    let cachedMe = null;

    async function loadMe() {
      try {
        cachedMe = await api("/api/me");
      } catch {
        cachedMe = null;
      }
      return cachedMe;
    }

    function currentRole() {
      return String(cachedMe?.role || cachedMe?.user?.role || "").toLowerCase();
    }

    function renderLohnLinkCard(linkPayload) {
      const role = currentRole();
      // Firmen-Admins need no platform-link UX — Superadmin connects once; company just uses Lohn.
      if (role === "company-admin") {
        return "";
      }
      if (linkPayload === null || linkPayload?.skipped) {
        if (linkPayload?.skipped) return "";
        return `<div class="card payroll-card" id="lohnLinkCard">
          <div class="label">${tr("lohnLinkLabel")}</div>
          <div class="label" style="margin:0.35rem 0;color:var(--warn,#b45309)">${tr("lohnLinkOff")}</div>
          <p class="muted">${tr("lohnLinkLoadError")}</p>
          <p class="muted"><a href="/index.html#admin">${tr("lohnLinkOpenAdmin")}</a></p>
        </div>`;
      }
      const link = linkPayload?.link || linkPayload || null;
      const enabled = Boolean(link && (Number(link.enabled) === 1 || link.enabled === true));
      const baseUrl = String(link?.base_url || link?.baseUrl || "").trim();
      const auto = Boolean(
        link &&
          (Number(link.auto_provision) === 1 ||
            link.auto_provision === true ||
            link.autoProvision === true)
      );
      if (!link || (!enabled && !baseUrl)) {
        return `<div class="card payroll-card" id="lohnLinkCard">
          <div class="label">${tr("lohnLinkLabel")}</div>
          <div class="label" style="margin:0.35rem 0;color:var(--warn,#b45309)">${tr("lohnLinkOff")}</div>
          <p class="muted">${tr("lohnLinkMissing")}</p>
          <p class="muted">${tr("lohnLinkHint")}</p>
          <p class="muted"><a href="/index.html#admin">${tr("lohnLinkOpenAdmin")}</a></p>
        </div>`;
      }
      return `<div class="card payroll-card" id="lohnLinkCard">
        <div class="label">${tr("lohnLinkLabel")}</div>
        <div class="label" style="margin:0.35rem 0;color:${enabled ? "var(--ok,#15803d)" : "var(--warn,#b45309)"}">${enabled ? tr("lohnLinkOn") : tr("lohnLinkOff")}</div>
        <p><strong>${tr("lohnLinkBase")}:</strong> ${baseUrl || "—"}</p>
        <p class="muted">${tr("lohnLinkAuto")}: ${auto ? "✓" : "—"}</p>
        <p class="muted">${tr("lohnLinkHint")}</p>
        <p class="muted"><a href="/index.html#admin">${tr("lohnLinkOpenAdmin")}</a></p>
      </div>`;
    }

    function wirePayrollActions() {
      document.querySelectorAll("[data-payroll]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const id = btn.getAttribute("data-id");
          const action = btn.getAttribute("data-payroll");
          if (!id) return;
          if (action === "approve" && !window.confirm(tr("payrollConfirmApprove"))) return;
          if (action === "reject" && !window.confirm(tr("payrollConfirmReject"))) return;
          try {
            await api(`/api/payroll/statements/${encodeURIComponent(id)}/${action}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: "{}",
            });
            await load();
          } catch (e) {
            alert(e.message || tr("payrollFailed"));
          }
        });
      });
    }

    function wireDataAlertActions() {
      document.querySelectorAll("[data-data-alert='dismiss']").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const id = btn.getAttribute("data-id");
          if (!id) return;
          try {
            await api(`/api/payroll/accounting/data-alerts/${encodeURIComponent(id)}/dismiss`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: "{}",
            });
            await load();
          } catch (e) {
            alert(e.message || tr("dataAlertsDismissFailed"));
          }
        });
      });
    }

    function wireLohnMessageActions() {
      document.querySelectorAll("[data-lohn-msg='open']").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const id = btn.getAttribute("data-id");
          if (!id) return;
          try {
            await api(`/api/payroll/accounting/messages/${encodeURIComponent(id)}/open`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: "{}",
            });
            await load();
          } catch (e) {
            alert(e.message || tr("lohnMessagesOpenFailed"));
          }
        });
      });
      document.querySelectorAll("[data-lohn-msg='dismiss-banner']").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const id = btn.getAttribute("data-id");
          if (!id) return;
          try {
            await api(`/api/payroll/accounting/messages/${encodeURIComponent(id)}/dismiss-banner`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: "{}",
            });
            await load();
          } catch (e) {
            alert(e.message || tr("lohnMessagesOpenFailed"));
          }
        });
      });
      document.getElementById("lohnMessagesSyncBtn")?.addEventListener("click", async () => {
        try {
          await api("/api/payroll/accounting/messages/sync", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: companyId ? JSON.stringify({ companyId }) : "{}",
          });
          await load();
        } catch (e) {
          alert(e.message || tr("lohnMessagesOpenFailed"));
        }
      });
      document.getElementById("lohnMessagesTestBtn")?.addEventListener("click", async () => {
        const cid =
          companyId ||
          String(lastPayload?.companies?.[0]?.id || lastPayload?.companies?.[0]?.companyId || "").trim();
        if (!cid) {
          alert(tr("lohnMessagesTestNeedCompany"));
          return;
        }
        try {
          await api("/api/payroll/accounting/messages/test", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              companyId: cid,
              period: String(lastStatusDate || "").slice(0, 7),
              kind: "missing_data",
            }),
          });
          await load();
          const hub = document.getElementById("lohnHub");
          if (hub) hub.scrollIntoView({ behavior: "smooth", block: "start" });
          alert(tr("lohnMessagesTestOk"));
        } catch (e) {
          alert(e.message || tr("lohnMessagesOpenFailed"));
        }
      });
    }

    async function loadPayrollPending() {
      try {
        let url = "/api/payroll/statements/pending";
        if (companyId) url += `?company_id=${encodeURIComponent(companyId)}`;
        const data = await api(url);
        return data.batches || [];
      } catch {
        return [];
      }
    }

    async function loadDataAlerts() {
      try {
        let url = "/api/payroll/accounting/data-alerts";
        if (companyId) url += `?company_id=${encodeURIComponent(companyId)}`;
        const data = await api(url);
        return data.alerts || [];
      } catch {
        return [];
      }
    }

    async function loadLohnMessages() {
      try {
        let url = "/api/payroll/accounting/messages";
        if (companyId) url += `?company_id=${encodeURIComponent(companyId)}`;
        const data = await api(url);
        return data.messages || [];
      } catch {
        return [];
      }
    }

    async function loadLohnPlatformLink() {
      if (currentRole() === "company-admin") {
        return { skipped: true };
      }
      try {
        return await api("/api/payroll/accounting/platform-link");
      } catch {
        return null;
      }
    }

    function render(data, forecast, guardianBundle, payrollBatches, lohnLink, dataAlerts, lohnMessages) {
      const guardian = guardianBundle?.status || guardianBundle;
      const guardianHistory = guardianBundle?.history || [];
      lastPayload = data;
      lastForecast = forecast;
      lastGuardianBundle = guardianBundle;
      lastStatusDate = data.date || "—";
      lastStatusScope = data.scope || "global";
      const status = document.getElementById("status");
      const grid = document.getElementById("grid");
      const totals = data.totals || {};
      const scopeLabel = data.scope === "global" ? tr("scopeGlobal") : tr("scopeOne");
      status.textContent = `${lastStatusDate} · ${scopeLabel} · ${tr("live")}`;

      const emerg = totals.activeEmergencies ?? 0;
      const sec = totals.openSecurityAlerts ?? 0;
      const prompts = actionPrompts();

      updateLohnHeaderChip(lohnMessages);
      grid.innerHTML = `
        ${renderLohnHubSafe(lohnLink, lohnMessages, dataAlerts, payrollBatches)}
        ${renderGuardianCard(guardian, guardianHistory)}
        <div class="card ops-card clickable" data-action="onsite" title="${tr("cardOnSiteHint")}">
          <div class="ops-label">${tr("cardOnSite")}</div><div class="ops-metric">${totals.workersOnSite ?? 0}</div>
        </div>
        <div class="card clickable" data-action="companies">
          <div class="label">${tr("cardCompanies")}</div><div class="metric">${totals.companies ?? 0}</div>
        </div>
        <div class="card clickable ${emerg > 0 ? "critical" : ""}" data-action="emergency">
          <div class="label">${tr("cardEmergencies")}</div><div class="metric" style="color:${emerg > 0 ? "var(--danger)" : "var(--accent)"}">${emerg}</div>
        </div>
        <div class="card clickable ${sec > 3 ? "critical" : ""}" data-action="security">
          <div class="label">${tr("cardSecurity")}</div><div class="metric">${sec}</div>
        </div>
        <div class="card" style="grid-column: 1 / -1">
          <div class="label">${tr("companiesTableTitle")}</div>
          <table>
            <thead><tr><th>${tr("thCompany")}</th><th>${tr("thOnSite")}</th><th>${tr("thGates")}</th><th>${tr("thEmergency")}</th><th>${tr("thSecurity")}</th></tr></thead>
            <tbody>${(data.companies || []).map((c) => `
              <tr data-cid="${c.id || c.companyId || ""}" data-name="${(c.name || "").replace(/"/g, "")}">
                <td><strong>${c.name}</strong></td>
                <td>${c.workersOnSite}</td>
                <td>${c.activeGatesToday}</td>
                <td>${c.activeEmergencies > 0 ? "⚠ " + c.activeEmergencies : "—"}</td>
                <td>${c.openSecurityAlerts > 0 ? c.openSecurityAlerts : "—"}</td>
              </tr>`).join("")}</tbody>
          </table>
          <div class="actions">
            <a href="${companyLink("/ai-command-center.html", companyId)}">${tr("navAi")}</a>
            <a href="/admin-v2/index.html#inbox">${tr("inbox")}</a>
            <button type="button" id="refreshBtn">${tr("refreshNow")}</button>
          </div>
        </div>
        <div class="card" style="grid-column: 1 / -1">
          <div class="label">${tr("liveEvents")}</div>
          <div id="eventFeed" class="event-feed"><span class="muted">${tr("connecting")}</span></div>
        </div>`;

      grid.querySelectorAll("[data-action]").forEach((el) => {
        el.addEventListener("click", () => {
          const a = el.dataset.action;
          const base = companyLink("/ai-command-center.html", companyId);
          const q = encodeURIComponent(prompts[a] || "");
          location.href = `${base}${base.includes("?") ? "&" : "?"}autoprompt=${q}`;
        });
      });

      grid.querySelectorAll("tr[data-cid]").forEach((row) => {
        row.addEventListener("click", () => {
          const cid = row.dataset.cid;
          if (!cid) return;
          location.href = companyLink("/ai-command-center.html", cid);
        });
      });
      document.getElementById("refreshBtn")?.addEventListener("click", load);
      wireGuardianActions();
      wirePayrollActions();
      wireDataAlertActions();
      wireLohnMessageActions();
      if (forecast) renderForecastCard(grid, forecast);
      startEventStream().catch(() => {});
    }

    async function loadForecast() {
      if (!companyId) return null;
      try {
        return await api(
          `/api/ops-os/predictions/tomorrow?company_id=${encodeURIComponent(companyId)}`,
        );
      } catch {
        return null;
      }
    }

    async function loadGuardianBundle() {
      try {
        const [status, historyPayload] = await Promise.all([
          api("/api/guardian/status"),
          api("/api/guardian/history?limit=20"),
        ]);
        return { status, history: historyPayload.history || [] };
      } catch {
        return { status: null, history: [] };
      }
    }

    async function load() {
      const status = document.getElementById("status");
      const grid = document.getElementById("grid");
      try {
        let url = "/api/ops-os/command-center";
        if (companyId) url += `?company_id=${encodeURIComponent(companyId)}`;
        await loadMe();
        const [data, forecast, guardianBundle, payrollBatches, lohnLink, dataAlerts, lohnMessages] = await Promise.all([
          api(url),
          loadForecast(),
          loadGuardianBundle(),
          loadPayrollPending(),
          loadLohnPlatformLink(),
          loadDataAlerts(),
          loadLohnMessages(),
        ]);
        render(data, forecast, guardianBundle, payrollBatches, lohnLink, dataAlerts, lohnMessages);
      } catch (e) {
        status.textContent = "";
        grid.innerHTML = `<p class="err">${tr("authError")} ${e.message}</p>`;
      }
    }

    let stopRealtime = null;

    async function startEventStream() {
      const feed = document.getElementById("eventFeed");
      if (!feed || !window.SUPPIXOpsRealtime) return;
      if (stopRealtime) stopRealtime();
      feed.innerHTML = `<span class="muted">${tr("connectingStream")}</span>`;
      stopRealtime = await window.SUPPIXOpsRealtime.start({
        companyId,
        feedEl: feed,
        getHeaders: () => window.BaupassAuth?.authHeaders?.({ Accept: "application/json" }) || {},
        onMode: (mode) => {
          const st = document.getElementById("status");
          if (st) {
            const scopeLabel = lastStatusScope === "global" ? tr("scopeGlobal") : tr("scopeOne");
            st.textContent = `${lastStatusDate} · ${scopeLabel} · ${tr("live")} (${mode})`;
          }
        },
      });
    }

    (function initEmbed() {
      const params = new URLSearchParams(location.search);
      if (params.get("embed") === "1") {
        document.documentElement.classList.add("embed-document");
        document.body.classList.add("embed-mode");
        document.querySelector(".ops-header .ops-nav")?.remove();
        document.querySelector("header .ops-nav")?.remove();
      } else if (window.BaupassEmbed) {
        const extra = companyId ? { company_id: companyId } : {};
        window.BaupassEmbed.wireEmbedNav(".ops-nav a[href^='/']", extra);
      }
    })();

    async function waitForEmbedSession(maxMs = 3200) {
      const embedded =
        qs.get("embed") === "1" ||
        (window.BaupassEmbed?.isEmbedMode?.() && window.self !== window.top);
      if (!embedded) return;
      const deadline = Date.now() + maxMs;
      while (Date.now() < deadline) {
        if (window.BaupassAuth?.getSessionToken?.()) return;
        await new Promise((resolve) => setTimeout(resolve, 60));
      }
    }

    let loadScheduled = false;

    window.addEventListener("message", (event) => {
      if (event.origin !== location.origin || !event?.data) return;
      if (event.data.type === "baupass-sync-token" && event.data.token && loadScheduled) {
        load().catch(() => {});
      }
    });

    initOpsLangSync();
    (async () => {
      loadScheduled = true;
      try {
        await waitForEmbedSession();
        if (window.BaupassAuth?.bootstrapSession) {
          await window.BaupassAuth.bootstrapSession();
        }
      } catch {
        // load() surfaces auth errors in the grid
      }
      try {
        if (window.BaupassAuth?.resolveTenantBranding) {
          await window.BaupassAuth.resolveTenantBranding({ companyId });
        }
      } catch {
        // optional branding
      }
      load();
      setInterval(load, 15000);
    })();

    (async () => {
      const ap = qs.get("autoprompt");
      if (ap) {
        const dest = companyLink("/ai-command-center.html", companyId) + (companyId ? "&" : "?") + "autoprompt=" + ap;
        if (!location.pathname.includes("ai-command")) location.href = dest;
      }
    })();
  </script>
</body>
</html>
