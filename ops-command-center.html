<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
  <meta charset="utf-8" />

  <style>
    main { padding: 0.75rem 1rem; display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    .card {
      background: var(--panel); border-radius: 12px; padding: 0.85rem; border: 1px solid var(--border);
      transition: border-color 0.2s, transform 0.15s;
    }
    .card.critical { border-color: var(--danger); box-shadow: 0 0 0 1px rgba(248, 113, 113, 0.25); }
    .card.clickable { cursor: pointer; }
    .card.clickable:hover { border-color: var(--accent); transform: translateY(-2px); }
    .metric { font-size: 1.65rem; font-weight: 700; color: var(--accent); }
    .label { font-size: 0.8rem; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { text-align: start; padding: 0.4rem 0.35rem; border-bottom: 1px solid var(--border); }
    tr[data-cid] { cursor: pointer; }
    tr[data-cid]:hover { background: #14202c; }
    .err { color: var(--danger); padding: 1rem; }
    #status { font-size: 0.8rem; color: var(--muted); }
    .actions { margin-top: 0.6rem; display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .actions a, .actions button {
      font-size: 0.72rem; padding: 0.3rem 0.55rem; border-radius: 8px; border: 1px solid var(--border);
      background: #0c1218; color: var(--accent); cursor: pointer; text-decoration: none;
    }
    .event-feed { max-height: 190px; overflow-y: auto; font-size: 0.74rem; }
    .event-line { padding: 0.35rem 0; border-bottom: 1px solid var(--border); color: var(--muted); }
    .event-line strong { color: var(--text); }
    .guardian-card {
      grid-column: 1 / -1 !important;
      position: relative;
      z-index: 6;
      overflow: hidden;
      border-radius: 18px !important;
      padding: 0 !important;
      min-height: 9.5rem;
      border: 1px solid rgba(75, 227, 209, 0.55) !important;
      background:
        radial-gradient(900px 260px at 92% -10%, rgba(75, 227, 209, 0.22), transparent 55%),
        radial-gradient(700px 220px at 0% 110%, rgba(56, 189, 248, 0.12), transparent 50%),
        linear-gradient(165deg, rgba(10, 22, 34, 0.99), rgba(6, 10, 16, 0.99)) !important;
      box-shadow:
        0 0 0 1px rgba(75, 227, 209, 0.12),
        0 18px 48px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    .guardian-card.degraded {
      border-color: rgba(251, 191, 36, 0.65) !important;
      background:
        radial-gradient(900px 260px at 92% -10%, rgba(251, 191, 36, 0.2), transparent 55%),
        linear-gradient(165deg, rgba(28, 22, 10, 0.98), rgba(8, 10, 14, 0.99)) !important;
      box-shadow:
        0 0 0 1px rgba(251, 191, 36, 0.15),
        0 18px 48px rgba(0, 0, 0, 0.42);
      animation: guardianPulseWarn 2.4s ease-in-out infinite;
    }
    .guardian-card.down {
      border-color: rgba(248, 113, 113, 0.75) !important;
      background:
        radial-gradient(900px 260px at 92% -10%, rgba(248, 113, 113, 0.22), transparent 55%),
        linear-gradient(165deg, rgba(32, 12, 14, 0.99), rgba(8, 8, 12, 0.99)) !important;
      box-shadow:
        0 0 0 1px rgba(248, 113, 113, 0.2),
        0 18px 48px rgba(0, 0, 0, 0.45);
      animation: guardianPulseDown 1.6s ease-in-out infinite;
    }
    @keyframes guardianPulseWarn {
      0%, 100% { box-shadow: 0 0 0 1px rgba(251, 191, 36, 0.15), 0 18px 48px rgba(0, 0, 0, 0.42); }
      50% { box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.35), 0 18px 48px rgba(0, 0, 0, 0.42); }
    }
    @keyframes guardianPulseDown {
      0%, 100% { box-shadow: 0 0 0 1px rgba(248, 113, 113, 0.2), 0 18px 48px rgba(0, 0, 0, 0.45); }
      50% { box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.4), 0 18px 48px rgba(0, 0, 0, 0.45); }
    }
    @keyframes guardianRadarSweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes guardianBreath {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.06); }
    }
    @keyframes guardianBlipPing {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.35); opacity: 0.55; }
    }
    .guardian-shell { position: relative; z-index: 1; }
    .guardian-head {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 1rem;
      align-items: center;
      padding: 1.05rem 1.15rem 0.85rem;
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
      background: linear-gradient(90deg, rgba(75, 227, 209, 0.14), rgba(75, 227, 209, 0.02));
    }
    .guardian-card.degraded .guardian-head {
      background: linear-gradient(90deg, rgba(251, 191, 36, 0.16), rgba(251, 191, 36, 0.02));
    }
    .guardian-card.down .guardian-head {
      background: linear-gradient(90deg, rgba(248, 113, 113, 0.18), rgba(248, 113, 113, 0.02));
    }
    @media (max-width: 720px) {
      .guardian-head { grid-template-columns: auto 1fr; }
      .guardian-meta { grid-column: 1 / -1; justify-self: start; text-align: start; }
    }
    .guardian-mark {
      width: 3.6rem; height: 3.6rem; border-radius: 16px;
      display: grid; place-items: center;
      background: rgba(75, 227, 209, 0.14);
      border: 1px solid rgba(75, 227, 209, 0.45);
      box-shadow: 0 0 24px rgba(75, 227, 209, 0.18);
      position: relative;
    }
    .guardian-card.degraded .guardian-mark {
      background: rgba(251, 191, 36, 0.14);
      border-color: rgba(251, 191, 36, 0.5);
      box-shadow: 0 0 24px rgba(251, 191, 36, 0.18);
    }
    .guardian-card.down .guardian-mark {
      background: rgba(248, 113, 113, 0.14);
      border-color: rgba(248, 113, 113, 0.55);
      box-shadow: 0 0 24px rgba(248, 113, 113, 0.2);
    }
    .guardian-mark svg { width: 1.85rem; height: 1.85rem; display: block; }
    .guardian-mark-dot {
      position: absolute; right: -0.15rem; top: -0.15rem;
      width: 0.72rem; height: 0.72rem; border-radius: 999px;
      background: var(--accent);
      border: 2px solid #0a121a;
      animation: guardianBreath 1.8s ease-in-out infinite;
    }
    .guardian-card.degraded .guardian-mark-dot { background: #fbbf24; }
    .guardian-card.down .guardian-mark-dot { background: #f87171; }
    .guardian-title {
      font-weight: 800; color: #f4f9ff !important; font-size: 1.35rem;
      letter-spacing: -0.02em; line-height: 1.1;
    }
    .guardian-sub {
      margin-top: 0.28rem; color: var(--muted); font-size: 0.78rem; line-height: 1.4; max-width: 36rem;
    }
    .guardian-status-row {
      display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; margin-top: 0.55rem;
    }
    .guardian-status {
      font-size: 0.78rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 0.28rem 0.65rem; border-radius: 999px;
      color: #04201c; background: var(--accent);
      border: 1px solid rgba(75, 227, 209, 0.7);
    }
    .guardian-card.degraded .guardian-status {
      color: #2a1a00; background: #fbbf24; border-color: rgba(251, 191, 36, 0.8);
    }
    .guardian-card.down .guardian-status {
      color: #2a0606; background: #f87171; border-color: rgba(248, 113, 113, 0.85);
    }
    .guardian-live {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--accent); padding: 0.22rem 0.5rem; border-radius: 999px;
      border: 1px solid rgba(75, 227, 209, 0.4); background: rgba(75, 227, 209, 0.08);
    }
    .guardian-card.degraded .guardian-live { color: #fbbf24; border-color: rgba(251, 191, 36, 0.4); background: rgba(251, 191, 36, 0.08); }
    .guardian-card.down .guardian-live { color: #f87171; border-color: rgba(248, 113, 113, 0.4); background: rgba(248, 113, 113, 0.08); }
    .guardian-meta {
      display: flex; flex-direction: column; align-items: flex-end; gap: 0.45rem;
      text-align: end; font-size: 0.72rem; color: var(--muted); line-height: 1.45;
      min-width: 8.5rem;
    }
    .guardian-meta strong { display: block; color: #e8f2ff; font-size: 0.82rem; font-weight: 650; }
    .guardian-radar {
      width: 7.25rem;
      flex: 0 0 auto;
    }
    .guardian-radar-screen {
      position: relative;
      width: 7.25rem; height: 7.25rem;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid rgba(75, 227, 209, 0.45);
      background:
        radial-gradient(circle at center, rgba(75, 227, 209, 0.16) 0 2px, transparent 3px),
        radial-gradient(circle at center, rgba(8, 18, 26, 0.2), rgba(4, 10, 16, 0.95));
      box-shadow:
        inset 0 0 18px rgba(75, 227, 209, 0.12),
        0 0 18px rgba(75, 227, 209, 0.1);
    }
    .guardian-card.degraded .guardian-radar-screen {
      border-color: rgba(251, 191, 36, 0.5);
      box-shadow: inset 0 0 18px rgba(251, 191, 36, 0.12), 0 0 18px rgba(251, 191, 36, 0.1);
    }
    .guardian-card.down .guardian-radar-screen {
      border-color: rgba(248, 113, 113, 0.55);
      box-shadow: inset 0 0 18px rgba(248, 113, 113, 0.14), 0 0 18px rgba(248, 113, 113, 0.12);
    }
    .guardian-radar-ring {
      position: absolute; inset: 0; margin: auto;
      border-radius: 50%;
      border: 1px solid rgba(75, 227, 209, 0.22);
      pointer-events: none;
    }
    .guardian-card.degraded .guardian-radar-ring { border-color: rgba(251, 191, 36, 0.28); }
    .guardian-card.down .guardian-radar-ring { border-color: rgba(248, 113, 113, 0.3); }
    .guardian-radar-ring.r1 { width: 32%; height: 32%; }
    .guardian-radar-ring.r2 { width: 58%; height: 58%; }
    .guardian-radar-ring.r3 { width: 84%; height: 84%; }
    .guardian-radar-cross::before,
    .guardian-radar-cross::after {
      content: "";
      position: absolute;
      background: rgba(75, 227, 209, 0.18);
      pointer-events: none;
    }
    .guardian-card.degraded .guardian-radar-cross::before,
    .guardian-card.degraded .guardian-radar-cross::after { background: rgba(251, 191, 36, 0.22); }
    .guardian-card.down .guardian-radar-cross::before,
    .guardian-card.down .guardian-radar-cross::after { background: rgba(248, 113, 113, 0.24); }
    .guardian-radar-cross::before { left: 50%; top: 8%; bottom: 8%; width: 1px; transform: translateX(-50%); }
    .guardian-radar-cross::after { top: 50%; left: 8%; right: 8%; height: 1px; transform: translateY(-50%); }
    .guardian-radar-sweep {
      position: absolute; inset: 0;
      background: conic-gradient(
        from 0deg,
        rgba(75, 227, 209, 0.0) 0deg,
        rgba(75, 227, 209, 0.0) 300deg,
        rgba(75, 227, 209, 0.08) 330deg,
        rgba(75, 227, 209, 0.42) 360deg
      );
      animation: guardianRadarSweep 3.2s linear infinite;
      transform-origin: center;
    }
    .guardian-card.degraded .guardian-radar-sweep {
      background: conic-gradient(
        from 0deg,
        rgba(251, 191, 36, 0.0) 0deg,
        rgba(251, 191, 36, 0.0) 300deg,
        rgba(251, 191, 36, 0.1) 330deg,
        rgba(251, 191, 36, 0.48) 360deg
      );
      animation-duration: 2.2s;
    }
    .guardian-card.down .guardian-radar-sweep {
      background: conic-gradient(
        from 0deg,
        rgba(248, 113, 113, 0.0) 0deg,
        rgba(248, 113, 113, 0.0) 300deg,
        rgba(248, 113, 113, 0.12) 330deg,
        rgba(248, 113, 113, 0.55) 360deg
      );
      animation-duration: 1.4s;
    }
    .guardian-radar-blip {
      position: absolute;
      width: 0.42rem; height: 0.42rem;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 8px currentColor;
      animation: guardianBlipPing 1.6s ease-in-out infinite;
    }
    .guardian-radar-blip.ok { background: var(--accent); color: var(--accent); }
    .guardian-radar-blip.fail { background: #f87171; color: #f87171; animation-duration: 0.9s; }
    .guardian-radar-blip.warn { background: #fbbf24; color: #fbbf24; }
    .guardian-radar-core {
      position: absolute; left: 50%; top: 50%;
      width: 0.45rem; height: 0.45rem;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: var(--accent);
      box-shadow: 0 0 10px rgba(75, 227, 209, 0.7);
    }
    .guardian-card.degraded .guardian-radar-core { background: #fbbf24; box-shadow: 0 0 10px rgba(251, 191, 36, 0.7); }
    .guardian-card.down .guardian-radar-core { background: #f87171; box-shadow: 0 0 10px rgba(248, 113, 113, 0.7); }
    .guardian-radar-caption {
      margin-top: 0.35rem;
      text-align: center;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(148, 163, 184, 0.95);
    }
    .guardian-body { padding: 0.85rem 1.15rem 1.05rem; }
    .guardian-alert {
      font-size: 0.86rem; font-weight: 650; color: #eaf3ff; margin-bottom: 0.35rem;
    }
    .guardian-extra { font-size: 0.74rem; color: var(--muted); margin-bottom: 0.65rem; line-height: 1.4; }
    .guardian-probes { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.15rem; }
    .guardian-probe {
      font-size: 0.7rem; padding: 0.28rem 0.55rem; border-radius: 999px;
      border: 1px solid var(--border); color: var(--muted);
      background: rgba(8, 14, 20, 0.55);
    }
    .guardian-probe.ok { border-color: rgba(75, 227, 209, 0.4); color: var(--accent); background: rgba(75, 227, 209, 0.08); }
    .guardian-probe.fail { border-color: rgba(248, 113, 113, 0.5); color: #f87171; background: rgba(248, 113, 113, 0.08); font-weight: 700; }
    .guardian-actions { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.85rem; }
    .guardian-actions button {
      font-size: 0.78rem; font-weight: 700; padding: 0.48rem 0.9rem; border-radius: 10px;
      border: 1px solid rgba(75, 227, 209, 0.45); background: rgba(75, 227, 209, 0.14);
      color: #eafffb; cursor: pointer;
    }
    .guardian-actions button:hover { filter: brightness(1.08); }
    .guardian-actions button.ghost {
      border-color: rgba(148, 163, 184, 0.35); background: rgba(8, 14, 20, 0.55); color: var(--accent); font-weight: 650;
    }
    .guardian-card.degraded .guardian-actions button {
      border-color: rgba(251, 191, 36, 0.5); background: rgba(251, 191, 36, 0.14); color: #fff8e8;
    }
    .guardian-card.down .guardian-actions button {
      border-color: rgba(248, 113, 113, 0.55); background: rgba(248, 113, 113, 0.16); color: #ffe8e8;
    }
    .guardian-ops { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.7rem; }
    .guardian-ops span {
      font-size: 0.7rem; color: var(--muted); padding: 0.26rem 0.55rem;
      border: 1px solid rgba(148, 163, 184, 0.22); border-radius: 999px;
      background: rgba(8, 14, 20, 0.45);
    }
    .guardian-ops span.warn { color: #fbbf24; border-color: rgba(251, 191, 36, 0.45); background: rgba(251, 191, 36, 0.08); font-weight: 700; }
    .guardian-history {
      margin-top: 0.75rem; font-size: 0.7rem; color: var(--muted);
      max-height: 120px; overflow-y: auto;
      border-top: 1px solid rgba(148, 163, 184, 0.14); padding-top: 0.55rem;
    }
    .guardian-history-row { padding: 0.22rem 0; border-bottom: 1px solid rgba(148, 163, 184, 0.1); }
    .payroll-card { grid-column: 1 / -1; }
    .payroll-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; justify-content: space-between; padding: 0.45rem 0; border-bottom: 1px solid var(--border); }
    .payroll-row:last-child { border-bottom: 0; }
    .payroll-actions button { margin-left: 0.25rem; }
    .lohn-notify-stack { grid-column: 1 / -1; display: grid; gap: 0.55rem; }
    .lohn-toast {
      display: grid; grid-template-columns: auto 1fr auto; gap: 0.75rem; align-items: start;
      padding: 0.9rem 1rem; border-radius: 14px;
      border: 1px solid rgba(251, 191, 36, 0.45);
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.16), rgba(15, 23, 32, 0.95));
      box-shadow: 0 10px 28px rgba(0,0,0,0.28);
      animation: lohnToastIn 0.35s ease-out;
    }
    @keyframes lohnToastIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .lohn-toast-badge {
      width: 2.35rem; height: 2.35rem; border-radius: 12px; display: grid; place-items: center;
      background: rgba(251, 191, 36, 0.2); color: #fbbf24; font-weight: 800; font-size: 0.85rem;
    }
    .lohn-toast-title { font-weight: 700; color: var(--text); font-size: 0.95rem; }
    .lohn-toast-body { margin-top: 0.2rem; color: var(--muted); font-size: 0.78rem; line-height: 1.35; }
    .lohn-toast-meta { margin-top: 0.35rem; font-size: 0.68rem; color: #fbbf24; letter-spacing: 0.02em; }
    .lohn-toast-actions { display: flex; flex-direction: column; gap: 0.3rem; }
    .lohn-toast-actions button, .lohn-hub button, .lohn-item button,
    .lohn-toast-actions a, .lohn-item-actions a {
      font-size: 0.72rem; padding: 0.35rem 0.6rem; border-radius: 8px;
      border: 1px solid var(--border); background: #0c1218; color: var(--accent); cursor: pointer;
      white-space: nowrap; text-decoration: none; text-align: center; display: inline-block;
    }
    .lohn-toast-actions button.primary, .lohn-item button.primary,
    .lohn-toast-actions a.primary, .lohn-item-actions a.primary {
      border-color: rgba(75, 227, 209, 0.45); background: rgba(75, 227, 209, 0.12);
    }
    .lohn-toast-actions button.ghost { color: var(--muted); }
    .lohn-hub {
      grid-column: 1 / -1 !important;
      border: 1px solid rgba(75, 227, 209, 0.4) !important;
      background:
        radial-gradient(1200px 280px at 8% -20%, rgba(75, 227, 209, 0.16), transparent 55%),
        linear-gradient(165deg, rgba(16, 26, 36, 0.99), rgba(8, 12, 18, 0.99)) !important;
      border-radius: 18px; padding: 0;
      overflow: hidden;
      min-height: 8rem;
      position: relative;
      z-index: 5;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.28);

    .lohn-hub-head {
      display: flex; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; align-items: center;
      padding: 1rem 1.1rem; border-bottom: 1px solid rgba(148, 163, 184, 0.18);
      background: linear-gradient(90deg, rgba(75, 227, 209, 0.12), rgba(75, 227, 209, 0.03));
    }
    .lohn-hub-title { font-weight: 750; color: #f1f7ff !important; font-size: 1.12rem; letter-spacing: -0.01em; }
    .lohn-hub-sub { color: var(--muted); font-size: 0.74rem; margin-top: 0.2rem; max-width: 42rem; line-height: 1.4; }
    .lohn-hub-pills { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .lohn-pill {
      font-size: 0.68rem; padding: 0.22rem 0.55rem; border-radius: 999px;
      border: 1px solid var(--border); color: var(--muted);
      background: rgba(8, 14, 20, 0.45);
    }
    .lohn-pill.warn { color: #fbbf24; border-color: rgba(251, 191, 36, 0.4); background: rgba(251, 191, 36, 0.08); }

    .lohn-hub-body {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
    }
    @media (min-width: 980px) {
      .lohn-hub-body {
        grid-template-columns: 1.15fr 0.85fr;
      }
      .lohn-section-span {
        grid-column: 1 / -1;
      }
    }
    .lohn-section { padding: 0.95rem 1.1rem; border-bottom: 1px solid rgba(148, 163, 184, 0.14); }
    .lohn-section:last-child { border-bottom: 0; }
    .lohn-stat-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr));
      gap: 0.45rem; margin: 0.45rem 0 0.2rem;
    }
    .lohn-stat {
      padding: 0.55rem 0.65rem; border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(8, 14, 20, 0.55);
    }
    .lohn-stat-label { font-size: 0.64rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .lohn-stat-value { margin-top: 0.15rem; font-size: 1.05rem; font-weight: 700; color: #eaf3ff; }
    .lohn-stat-value.warn { color: #fbbf24; }

      });

      if (statusEl && !lastPayload) statusEl.textContent = tr("loading");

      applyOpsUiLanguage();
      const langSel = document.getElementById("opsLangSelect");
      if (langSel && !langSel.dataset.bound) {
        langSel.dataset.bound = "1";
        langSel.addEventListener("change", () => {
          localStorage.setItem(UI_LANG_KEY, langSel.value);
          localStorage.setItem("baupass-admin-v2-lang", langSel.value);
          applyOpsUiLanguage();
          if (lastPayload) {
            render(

              lastForecast,
              lastGuardianBundle,
              lastLohnState.batches || [],
              lastLohnState.link,
              lastLohnState.alerts || [],

              lastLohnState.preview,
              lastLohnState.periodRequests || [],
            );
          }
          window.dispatchEvent(new CustomEvent("baupass-admin-lang", { detail: { lang: langSel.value } }));
        });
      }
    }

    function syncOpsLangFromParent(lang) {
      const code = String(lang || "").slice(0, 2).toLowerCase();
      if (!OPS_LANGS.includes(code) || code === OPS_LANG) return;
      try {
        localStorage.setItem(UI_LANG_KEY, code);
        localStorage.setItem("baupass-admin-v2-lang", code);
      } catch {
        /* ignore */
      }
      applyOpsUiLanguage();
      if (lastPayload) {
        render(
          lastPayload,
          lastForecast,
          lastGuardianBundle,
          lastLohnState.batches || [],
          lastLohnState.link,
          lastLohnState.alerts || [],
          lastLohnState.messages || [],
          lastLohnState.preview,
          lastLohnState.periodRequests || [],
        );
      }
    }

    function guardianRadarHtml({ failed = [], fixed = [], scanning = false } = {}) {
      const failSlots = [
        { left: "68%", top: "28%" },
        { left: "78%", top: "58%" },
        { left: "42%", top: "72%" },
        { left: "24%", top: "38%" },
      ];
      const fixSlots = [
        { left: "58%", top: "42%" },
        { left: "34%", top: "54%" },
        { left: "62%", top: "68%" },
        { left: "30%", top: "30%" },
      ];
      const failBlips = (failed || []).slice(0, 4).map((_, i) => {
        const s = failSlots[i];
        return `<span class="guardian-radar-blip fail" style="left:${s.left};top:${s.top}" title="${String(failed[i] || "fault")}"></span>`;
      }).join("");
      const fixBlips = (fixed || []).slice(0, 4).map((_, i) => {
        const s = fixSlots[i];
        return `<span class="guardian-radar-blip ok" style="left:${s.left};top:${s.top}" title="${String(fixed[i] || "fix")}"></span>`;
      }).join("");
      const idleBlip = (!failed.length && !fixed.length)
        ? `<span class="guardian-radar-blip ${scanning ? "warn" : "ok"}" style="left:62%;top:36%"></span>`
        : "";
      return `
        <div class="guardian-radar" aria-hidden="true" title="${tr("guardianRadarHint")}">
          <div class="guardian-radar-screen">
            <div class="guardian-radar-ring r1"></div>

            <div class="guardian-radar-ring r3"></div>

          <div class="guardian-radar-caption">${tr("guardianRadarCaption")}</div>
        </div>`;

    function inferMissingFields(m) {
      const fields = messageMissingFields(m);
      if (fields.length) return fields;
      const text = `${m?.kind || ""} ${m?.subject || ""} ${m?.body || ""}`.toLowerCase();
      const out = [];
      if (/iban|bank|konto|verbindung|sepa|bic/.test(text)) out.push("iban");
      if (/steuer|taxid|tax_id|steuerid|steuernummer/.test(text)) out.push("taxId");
      if (/versicherung|rv-?nummer|sozialversicherung|insurance/.test(text)) out.push("insuranceNumber");
      return out;
    }

    function workerStammdatenUrl(cid, workerId, fields, hintText) {
      const wid = String(workerId || "").trim();
      const company = String(cid || companyId || "").trim();
      let fieldList = Array.isArray(fields) ? fields.map((f) => String(f).trim()).filter(Boolean) : [];
      if (!fieldList.length && hintText) {
        fieldList = inferMissingFields({ subject: hintText, body: hintText, kind: hintText });
      }
      const payrollish = fieldList.some((f) => {
        const x = f.toLowerCase();
        return x.includes("iban") || x.includes("tax") || x.includes("steuer") || x.includes("bank") || x.includes("bic");
      }) || /iban|bank|konto|steuer|tax/.test(String(hintText || "").toLowerCase());
      // Contracts holds IBAN / Steuer-ID — best place for Lohn missing-data / bank connection.
      if (payrollish || fieldList.length || wid) {
        const u = new URL("/admin-v2/contracts.html", location.origin);
        if (company) u.searchParams.set("company_id", company);
        if (wid) u.searchParams.set("worker_id", wid);
        u.searchParams.set("focus", "payroll");
        if (fieldList.length) u.searchParams.set("fields", fieldList.join(","));
        return `${u.pathname}${u.search}`;
      }
      if (!wid) return "";
      const u = new URL("/index.html", location.origin);
      if (company) u.searchParams.set("company_id", company);
      u.searchParams.set("view", "workers");
      u.searchParams.set("worker_id", wid);
      u.hash = "workers";
      return `${u.pathname}${u.search}${u.hash}`;
    }

    function stammdatenButtonHtml(cid, workerId, fields, labelKey, hintText) {
      const href = workerStammdatenUrl(cid, workerId, fields, hintText);
      if (!href) return "";
      return `<a class="primary" href="${escapeLohnHtml(href)}" target="_blank" rel="noopener">${tr(labelKey || "lohnMessagesOpenWorker")}</a>`;
    }

    function messageMissingFields(m) {
      if (Array.isArray(m?.missingFields) && m.missingFields.length) return m.missingFields;
      const payload = m?.payload && typeof m.payload === "object" ? m.payload : {};
      const raw = payload.missingFields || payload.fields || [];
      if (Array.isArray(raw)) return raw;
      if (typeof raw === "string") return raw.split(",").map((s) => s.trim()).filter(Boolean);
      return [];
    }

    function formatLohnRelativeTime(iso) {
      const raw = String(iso || "").trim();
      if (!raw) return "";
      const ts = Date.parse(raw);
      if (!Number.isFinite(ts)) return "";
      const mins = Math.max(0, Math.round((Date.now() - ts) / 60000));
      if (mins < 1) return tr("lohnMessagesJustNow");
      if (mins < 60) return tr("lohnMessagesMinutesAgo", { n: mins });
      const hours = Math.round(mins / 60);
      if (hours < 48) return tr("lohnMessagesHoursAgo", { n: hours });
      return raw.slice(0, 16).replace("T", " ");
    }

    function playLohnNotifyChime() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        const ctx = new Ctx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = 880;
        gain.gain.value = 0.0001;
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;
        gain.gain.exponentialRampToValueAtTime(0.05, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
        osc.start(now);
        osc.stop(now + 0.3);
        setTimeout(() => ctx.close().catch(() => {}), 500);
      } catch {
        /* ignore audio failures */
      }
    }

    function humanizeLohnText(raw) {
      let text = String(raw || "").replace(/\s+/g, " ").trim();
      if (!text) return "";
      text = text
        .replace(/https?:\/\/\S+/gi, "")
        .replace(/POST\s+\/?\S+/gi, "")
        .replace(/Body:\s*\{[\s\S]*$/i, "")
        .replace(/platform\.payroll\.batch\.v1[^.…]*/gi, "Monatsdaten")
        .replace(/companyId\s*=\s*["']?[\w-]+["']?/gi, "")
        .replace(/\s{2,}/g, " ")
        .trim();
      if (text.length > 180) text = `${text.slice(0, 177)}…`;
      return text;
    }

    function escapeLohnHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

      const chip = document.getElementById("lohnHeaderChip");
      if (!chip) return;
      if (!canAccessWorkpassLohnUi()) {
        chip.hidden = true;

        chip.textContent = "WorkPass Lohn";
        chip.classList.remove("has-mail");
        return;
      }
      chip.hidden = false;
      chip.style.display = "";
      const list = Array.isArray(messages) ? messages : [];
      const n = list.length;
      const notify = list.filter((m) => m && m.bannerVisible === true).length;
      chip.textContent = n ? `WorkPass Lohn (${n})` : "WorkPass Lohn";
      chip.classList.toggle("has-mail", n > 0 || notify > 0);
      chip.href = "#lohnHub";
      chip.title = notify ? tr("lohnMessagesToastEyebrow") : tr("lohnHubTitle");

    let lastLohnSig = "";

    function lohnSignature(messages, alerts) {
      const m = (Array.isArray(messages) ? messages : [])
        .map((x) => `${x.id}:${x.bannerVisible === true ? 1 : 0}`)
        .join("|");
      const a = (Array.isArray(alerts) ? alerts : []).map((x) => String(x.id || "")).join("|");
      return `${m}#${a}`;
    }

    async function loadGuardianBundle() {
      const prev = lastGuardianBundle || { status: null, history: [] };
      try {
        // First /guardian/status may run a full probe cycle — allow more than the default soft timeout.
        const [status, historyPayload] = await Promise.all([
          apiSoft("/api/guardian/status", prev.status || null, 12000),
          apiSoft("/api/guardian/history?limit=20", { history: prev.history || [] }, 8000),
        ]);
        const resolved = {
          status: status?.timestamp ? status : (prev.status || status),
          history: historyPayload?.history?.length ? historyPayload.history : (prev.history || []),
        };
        // If soft-timeout returned empty, keep requesting in background and patch the card.
        if (!resolved.status?.timestamp) {
          Promise.resolve()
            .then(() => api("/api/guardian/status"))
            .then(async (fresh) => {
              if (!fresh?.timestamp) return;
              let history = resolved.history;
              try {
                const h = await apiSoft("/api/guardian/history?limit=20", { history }, 8000);
                history = h?.history || history;
              } catch {
                /* ignore */
              }
              lastGuardianBundle = { status: fresh, history };
              patchGuardianCard(lastGuardianBundle);
            })
            .catch(() => {});
        }
        return resolved;
      } catch {
        return prev;
      }
    }

    async function refreshLohnOnly() {
      if (!canAccessWorkpassLohnUi()) {
        applyOfficeLohnVisibility();
        updateLohnHeaderChip([]);
        return;
      }
      const [lohnMessages, dataAlerts, periodRequests, payrollBatches] = await Promise.all([
        loadLohnMessages(),
        loadDataAlerts(),
        loadLohnPeriodRequests(),
        loadPayrollPending(),
      ]);
      lastLohnState = {
        ...lastLohnState,
        messages: lohnMessages,
        alerts: dataAlerts,
        periodRequests,
        batches: payrollBatches,
      };
      updateLohnHeaderChip(lohnMessages);
      const hub = document.getElementById("lohnHub");
      const parent = hub?.parentElement;
      if (parent && hub) {
        const next = document.createElement("div");
        next.innerHTML = renderLohnHubSafe(
          lastLohnState.link,
          lohnMessages,
          dataAlerts,
          payrollBatches,
          lastLohnState.preview,
          periodRequests,
        );
        const toasts = next.querySelector(".lohn-notify-stack");
        const newHub = next.querySelector("#lohnHub");
        const oldToasts = parent.querySelector(".lohn-notify-stack");
        if (oldToasts && toasts) oldToasts.replaceWith(toasts);
        else if (toasts && !oldToasts) parent.insertBefore(toasts, hub);
        if (newHub) hub.replaceWith(newHub);
        wirePayrollActions();
        wireDataAlertActions();
        wireLohnMessageActions();
        wireLohnBatchActions();
      }
      try {
        const sig = `${(lohnMessages || []).map((m) => m?.id).join(",")}|${(dataAlerts || []).map((a) => a?.id).join(",")}|${(periodRequests || []).map((r) => r?.id).join(",")}|${(payrollBatches || []).map((b) => b?.id).join(",")}`;
        if (sig !== lastLohnState._bumpSig) {
          lastLohnState._bumpSig = sig;
          localStorage.setItem("workpass-lohn-inbox-bump", String(Date.now()));
        }
      } catch {
        /* ignore */
      }
    }

    async function load(opts = {}) {
      if (lohnActionBusy) return; // don't wipe buttons mid-handoff
      const mode = opts.mode || "full";
      const status = document.getElementById("status");
      const grid = document.getElementById("grid");
      const focusLohn = location.hash === "#lohnHub" || mode === "lohn";
      const gen = (load._gen = (load._gen || 0) + 1);
      try {
        await loadMeCached();
        applyOfficeLohnVisibility();
        if (gen !== load._gen) return;

        if (!canAccessWorkpassLohnUi()) {
          updateLohnHeaderChip([]);
          if (mode === "poll" || mode === "lohn") {
            if (status && mode !== "poll") status.textContent = `${lastStatusDate || "—"} · ${tr("live")}`;
            return;
          }
        }

        if (mode === "poll") {
          await refreshLohnOnly();
          return;
        }

        // Always paint Lohn + light shell first (sub-second), then fill heavy widgets.
        const [lohnMessages, dataAlerts, periodRequests] = canAccessWorkpassLohnUi()
          ? await Promise.all([
              loadLohnMessages(),
              loadDataAlerts(),
              loadLohnPeriodRequests(),
            ])
          : [[], [], []];
        if (gen !== load._gen) return;
        lastLohnState.messages = lohnMessages;
        lastLohnState.alerts = dataAlerts;
        lastLohnState.periodRequests = periodRequests;
        updateLohnHeaderChip(lohnMessages);
        render(
          lastPayload || {
            date: "—",
            scope: companyId ? "company" : "global",
            totals: {},
            companies: [],
          },
          lastForecast,
          lastGuardianBundle || { status: null, history: [] },
          lastLohnState.batches || [],
          lastLohnState.link,
          dataAlerts,
          lohnMessages,
          lastLohnState.preview,
          periodRequests,
        );
        if (location.hash === "#lohnHub") {
          document.getElementById("lohnHub")?.scrollIntoView({ behavior: "smooth", block: "start" });
        }
        if (mode === "lohn") {
          if (status) status.textContent = `${lastStatusDate} · ${tr("live")}`;
          return;
        }

        let url = "/api/ops-os/command-center";
        if (companyId) url += `?company_id=${encodeURIComponent(companyId)}`;
        const [data, forecast, guardianBundle, payrollBatches, lohnLink, employeePreview] = await Promise.all([
          apiSoft(url, lastPayload || { totals: {}, companies: [] }, 3500),
          loadForecast(),
          loadGuardianBundle(),
          canAccessWorkpassLohnUi() ? loadPayrollPending() : Promise.resolve([]),
          canAccessWorkpassLohnUi() ? loadLohnPlatformLink() : Promise.resolve({ skipped: true }),
          // Employee preview is heavy — only when a company is selected
          canAccessWorkpassLohnUi() && companyId ? loadLohnEmployeePreview() : Promise.resolve(null),
        ]);
        if (gen !== load._gen) return;
        lastLohnState = {
          messages: lohnMessages,
          alerts: dataAlerts,
          batches: payrollBatches,
          link: lohnLink,
          preview: employeePreview,
          periodRequests,
        };
        render(
          data && (data.totals || data.companies)
            ? data
            : lastPayload || { date: "—", scope: companyId ? "company" : "global", totals: {}, companies: [] },
          forecast,
          guardianBundle,
          payrollBatches,
          lohnLink,
          dataAlerts,
          lohnMessages,
          employeePreview,
          periodRequests,
        );
        if (location.hash === "#lohnHub") {
          document.getElementById("lohnHub")?.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      } catch (e) {
        if (status) status.textContent = "";
        if (grid) grid.innerHTML = `<p class="err">${tr("authError")} ${e.message}</p>`;
      }
    }

    function render(data, forecast, guardianBundle, payrollBatches, lohnLink, dataAlerts, lohnMessages, employeePreview, periodRequests) {
      const guardian = guardianBundle?.status || guardianBundle;
      const guardianHistory = guardianBundle?.history || [];
      lastPayload = data;
      lastForecast = forecast;
      lastGuardianBundle = guardianBundle;
      lastStatusDate = data.date || "—";
      lastStatusScope = data.scope || "global";
      const status = document.getElementById("status");
      const grid = document.getElementById("grid");
      const totals = data.totals || {};
      const scopeLabel = data.scope === "global" ? tr("scopeGlobal") : tr("scopeOne");
      status.textContent = `${lastStatusDate} · ${scopeLabel} · ${tr("live")}`;

      const emerg = totals.activeEmergencies ?? 0;
      const sec = totals.openSecurityAlerts ?? 0;
      const prompts = actionPrompts();

      updateLohnHeaderChip(lohnMessages);
      {
        const sig = lohnSignature(lohnMessages, dataAlerts);
        if (lastLohnSig) {
          const prevNotify = (lastLohnSig.split("#")[0] || "")
            .split("|")
            .filter((s) => s.endsWith(":1")).length;
          const nextNotify = (lohnMessages || []).filter((m) => m && m.bannerVisible === true).length;
          if (nextNotify > prevNotify) playLohnNotifyChime();
        }
        lastLohnSig = sig;
      }
      grid.innerHTML = `
        ${renderGuardianCard(guardian, guardianHistory)}
        ${renderLohnHubSafe(lohnLink, lohnMessages, dataAlerts, payrollBatches, employeePreview, periodRequests)}
        <div class="card ops-card clickable" data-action="onsite" title="${tr("cardOnSiteHint")}">
          <div class="ops-label">${tr("cardOnSite")}</div><div class="ops-metric">${totals.workersOnSite ?? 0}</div>
        </div>
        <div class="card clickable" data-action="companies">
          <div class="label">${tr("cardCompanies")}</div><div class="metric">${totals.companies ?? 0}</div>
        </div>
        <div class="card clickable ${emerg > 0 ? "critical" : ""}" data-action="emergency">
          <div class="label">${tr("cardEmergencies")}</div><div class="metric" style="color:${emerg > 0 ? "var(--danger)" : "var(--accent)"}">${emerg}</div>
        </div>
        <div class="card clickable ${sec > 3 ? "critical" : ""}" data-action="security">
          <div class="label">${tr("cardSecurity")}</div><div class="metric">${sec}</div>
        </div>
        <div class="card" style="grid-column: 1 / -1">
          <div class="label">${tr("companiesTableTitle")}</div>
          <table>
            <thead><tr><th>${tr("thCompany")}</th><th>${tr("thOnSite")}</th><th>${tr("thGates")}</th><th>${tr("thEmergency")}</th><th>${tr("thSecurity")}</th></tr></thead>
            <tbody>${(data.companies || []).map((c) => `
              <tr data-cid="${c.id || c.companyId || ""}" data-name="${(c.name || "").replace(/"/g, "")}">
                <td><strong>${c.name}</strong></td>
                <td>${c.workersOnSite}</td>
                <td>${c.activeGatesToday}</td>
                <td>${c.activeEmergencies > 0 ? "⚠ " + c.activeEmergencies : "—"}</td>
                <td>${c.openSecurityAlerts > 0 ? c.openSecurityAlerts : "—"}</td>
              </tr>`).join("")}</tbody>
          </table>
          <div class="actions">
            <a href="${companyLink("/ai-command-center.html", companyId)}">${tr("navAi")}</a>
            <a href="/admin-v2/index.html#inbox">${tr("inbox")}</a>
            <button type="button" id="refreshBtn">${tr("refreshNow")}</button>
          </div>
        </div>
        <div class="card" style="grid-column: 1 / -1">
          <div class="label">${tr("liveEvents")}</div>
          <div id="eventFeed" class="event-feed"><span class="muted">${tr("connecting")}</span></div>
        </div>`;

      grid.querySelectorAll("[data-action]").forEach((el) => {
        el.addEventListener("click", () => {
          const a = el.dataset.action;
          const base = companyLink("/ai-command-center.html", companyId);
          const q = encodeURIComponent(prompts[a] || "");
          location.href = `${base}${base.includes("?") ? "&" : "?"}autoprompt=${q}`;
        });
      });

      grid.querySelectorAll("tr[data-cid]").forEach((row) => {
        row.addEventListener("click", () => {
          const cid = row.dataset.cid;
          if (!cid) return;
          location.href = companyLink("/ai-command-center.html", cid);
        });
      });
      document.getElementById("refreshBtn")?.addEventListener("click", load);
      wireGuardianActions();
      wirePayrollActions();
      wireDataAlertActions();
      wireLohnMessageActions();
      wireLohnBatchActions();
      if (forecast) renderForecastCard(grid, forecast);
      startEventStream().catch(() => {});
    }

    let lohnActionBusy = false;
    let lohnPollTimer = null;

    function setPeriodRowStatus(id, text, isError) {
      const el = document.querySelector(`[data-period-status="${CSS.escape(String(id || ""))}"]`);
      if (!el) {
        setLohnBatchStatus(text, isError);
        return;
      }
      if (!text) {
        el.hidden = true;
        el.textContent = "";
        el.classList.remove("err");
        return;
      }
      el.hidden = false;
      el.textContent = text;
      el.classList.toggle("err", !!isError);
      setLohnBatchStatus(text, isError);
    }

    async function confirmPeriodRequestById(id, btn) {
      if (lohnActionBusy) {
        alert(tr("lohnPeriodBusy"));
        return;
      }
      if (!id) {
        alert(tr("lohnPeriodNoId"));
        return;
      }
      lohnActionBusy = true;
      if (btn) btn.disabled = true;
      const row = document.querySelector(`[data-period-row="${CSS.escape(id)}"]`);
      row?.querySelectorAll("button").forEach((b) => { b.disabled = true; });
      setPeriodRowStatus(id, tr("lohnPeriodWorking"), false);
      try {
        const res = await api(`/api/payroll/accounting/period-requests/${encodeURIComponent(id)}/confirm`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: "{}",
        });
        if (res && res.ok === false) {
          throw new Error(res.message || res.error || tr("lohnBatchFailed"));
        }
        const detail = res?.message || tr("lohnPeriodConfirmOk");
        setPeriodRowStatus(id, detail, false);
        // Optimistic remove so UI feels instant even if reload is slow
        row?.remove();
        await load();
      } catch (e) {
        const msg = e?.payload?.message || e?.message || tr("lohnBatchFailed");
        setPeriodRowStatus(id, msg, true);
        alert(msg);
        row?.querySelectorAll("button").forEach((b) => { b.disabled = false; });
      } finally {
        lohnActionBusy = false;
        if (btn) btn.disabled = false;
      }
    }

    async function rejectPeriodRequestById(id, btn) {
      if (lohnActionBusy) {
        alert(tr("lohnPeriodBusy"));
        return;
      }
      if (!id) {
        alert(tr("lohnPeriodNoId"));
        return;
      }
      lohnActionBusy = true;
      if (btn) btn.disabled = true;
      setPeriodRowStatus(id, "…", false);
      try {
        const res = await api(`/api/payroll/accounting/period-requests/${encodeURIComponent(id)}/reject`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ reason: "" }),
        });
        if (res && res.ok === false) throw new Error(res.error || tr("lohnBatchFailed"));
        setPeriodRowStatus(id, tr("lohnPeriodRejectOk"), false);
        document.querySelector(`[data-period-row="${CSS.escape(id)}"]`)?.remove();
        await load();
      } catch (e) {
        const msg = e.message || tr("lohnBatchFailed");
        setPeriodRowStatus(id, msg, true);
        alert(msg);
      } finally {
        lohnActionBusy = false;
        if (btn) btn.disabled = false;
      }
    }

    function wireLohnPeriodRequestActions() {
      // Kept for compatibility — real wiring is document delegation below.
    }

    // Stable click wiring (survives 15s poll re-renders)
    document.addEventListener("click", (ev) => {
      const btn = ev.target?.closest?.("[data-lohn-action]");
      if (!btn) return;
      const action = btn.getAttribute("data-lohn-action");
      const id = String(btn.getAttribute("data-id") || "").trim();
      if (action === "period-confirm") {
        ev.preventDefault();
        ev.stopPropagation();
        confirmPeriodRequestById(id, btn);
      } else if (action === "period-reject") {
        ev.preventDefault();
        ev.stopPropagation();
        rejectPeriodRequestById(id, btn);
      }
    });

    let stopRealtime = null;

    async function startEventStream() {
      const feed = document.getElementById("eventFeed");
      if (!feed || !window.SUPPIXOpsRealtime) return;
      if (stopRealtime) stopRealtime();
      feed.innerHTML = `<span class="muted">${tr("connectingStream")}</span>`;
      stopRealtime = await window.SUPPIXOpsRealtime.start({
        companyId,
        feedEl: feed,
        getHeaders: () => window.BaupassAuth?.authHeaders?.({ Accept: "application/json" }) || {},
        onMode: (mode) => {
          const st = document.getElementById("status");
          if (st) {
            const scopeLabel = lastStatusScope === "global" ? tr("scopeGlobal") : tr("scopeOne");
            st.textContent = `${lastStatusDate} · ${scopeLabel} · ${tr("live")} (${mode})`;
          }
        },
      });
    }

    (function initEmbed() {
      const params = new URLSearchParams(location.search);
      if (params.get("embed") === "1") {
        document.documentElement.classList.add("embed-document");
        document.body.classList.add("embed-mode");
        document.querySelector(".ops-header .ops-nav")?.remove();
        document.querySelector("header .ops-nav")?.remove();
      } else if (window.BaupassEmbed) {
        const extra = companyId ? { company_id: companyId } : {};
        window.BaupassEmbed.wireEmbedNav(".ops-nav a[href^='/']", extra);
      }
    })();

    async function waitForEmbedSession(maxMs = 400) {
      const embedded =
        qs.get("embed") === "1" ||
        (window.BaupassEmbed?.isEmbedMode?.() && window.self !== window.top);
      if (!embedded) return;
      const deadline = Date.now() + maxMs;
      while (Date.now() < deadline) {
        if (window.BaupassAuth?.getSessionToken?.()) return;
        await new Promise((resolve) => setTimeout(resolve, 30));
      }
    }

    let loadScheduled = false;
    let opsAuthedLoadDone = false;

    window.addEventListener("message", (event) => {
      if (event.origin !== location.origin || !event?.data) return;
      if (event.data.type === "baupass-sync-token" && event.data.token && loadScheduled) {
        const nextCid = String(event.data.companyId || "").trim();
        const companyChanged = Boolean(nextCid) && nextCid !== companyId;
        if (companyChanged) {
          companyId = nextCid;
          const map = document.getElementById("mapLink");
          if (map) map.href = `/ops-live-map.html?company_id=${encodeURIComponent(companyId)}`;
        }
        // Parent re-broadcasts the same token often. Reload only when company changes
        // or we never completed an authenticated load yet.
        if (!companyChanged && opsAuthedLoadDone) return;
        clearTimeout(window.__opsTokenReloadT);
        window.__opsTokenReloadT = setTimeout(() => {
          load({ mode: "lohn" })
            .then(() => {
              opsAuthedLoadDone = true;
              return load({ mode: "full" });
            })
            .catch(() => {});
        }, 120);
      }
    });

    initOpsLangSync();
    (async () => {
      loadScheduled = true;
      // Immediate shell — never leave the page stuck on raw "Laden…".
      try {
        render(
          {
            date: "—",
            scope: companyId ? "company" : "global",
            totals: {},
            companies: [],
          },
          null,
          { status: null, history: [] },
          [],
          null,
          [],
          [],
          null,
          [],
        );
        const st = document.getElementById("status");
        if (st) st.textContent = tr("loading");
      } catch {
        /* keep gridLoading until load() */
      }
      try {
        await waitForEmbedSession(800);
        if (!window.BaupassAuth?.getSessionToken?.() && window.BaupassAuth?.bootstrapSession) {
          await Promise.race([
            window.BaupassAuth.bootstrapSession(),
            new Promise((_, reject) => setTimeout(() => reject(new Error("bootstrap_timeout")), 2000)),
          ]).catch(() => {});
        }
      } catch {
        // load() surfaces auth errors in the grid
      }
      window.BaupassAuth?.resolveTenantBranding?.({ companyId })?.catch?.(() => {});
      try {
        await load({ mode: "lohn" });
        if (window.BaupassAuth?.getSessionToken?.()) opsAuthedLoadDone = true;
      } catch (e) {
        const grid = document.getElementById("grid");
        if (grid && !grid.querySelector(".lohn-hub, .ops-card, .err")) {
          grid.innerHTML = `<p class="err">${tr("authError")} ${e?.message || ""}</p>`;
        }
      }
      load({ mode: "full" })
        .then(() => {
          if (window.BaupassAuth?.getSessionToken?.()) opsAuthedLoadDone = true;
        })
        .catch(() => {});
      if (lohnPollTimer) clearInterval(lohnPollTimer);
      lohnPollTimer = setInterval(() => {
        if (!lohnActionBusy) refreshLohnOnly().catch(() => {});
      }, 25000);
    })();

    (async () => {
      const ap = qs.get("autoprompt");
      if (ap) {
        const dest = companyLink("/ai-command-center.html", companyId) + (companyId ? "&" : "?") + "autoprompt=" + ap;
        if (!location.pathname.includes("ai-command")) location.href = dest;
      }
    })();
  </script>
</body>
</html>
